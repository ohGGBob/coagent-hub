<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232bd86a%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23059f4c%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22118%22%20fill%3D%22url(%23g)%22%2F%3E%3Cpath%20d%3D%22M96%20164%20a52%2052%200%200%201%2052%20-52%20h216%20a52%2052%200%200%201%2052%2052%20v140%20a52%2052%200%200%201%20-52%2052%20h-166%20l-68%2074%2020%20-74%20h-2%20a52%2052%200%200%201%20-52%20-52%20z%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M186%20316%20L198%20208%20L250%20262%20L276%20198%20L302%20262%20L354%20208%20L366%20316%20Z%22%20fill%3D%22%2307c160%22%2F%3E%3Crect%20x%3D%22186%22%20y%3D%22316%22%20width%3D%22180%22%20height%3D%2224%22%20rx%3D%228%22%20fill%3D%22%2307c160%22%2F%3E%3C%2Fsvg%3E">
  <title>CoAgent Hub</title>
<style>
/* ============ 设计令牌（微信视觉语言：浅色默认 + 微信绿） ============ */
:root {
  --bg: #f2f3f5;
  --bg-elev: #fff;
  --bg-card: #fff;
  --bg-hover: #f0f2f5;
  --bg-input: #f5f6f7;
  --border: #e5e6eb;
  --border-strong: #d2d5da;
  --text: #191919;
  --text-sub: #6b6f76;
  --text-mute: #a2a6ad;
  --accent: #07c160;
  --accent-hover: #06ad56;
  --accent-bg: rgba(7,193,96,0.10);
  --accent-border: rgba(7,193,96,0.30);
  --rail-bg: #2e2e2e;          /* 微信深色图标栏（亮色主题下也是深色） */
  --rail-text: #9d9d9d;
  --bubble-own: #95ec69;       /* 自己的气泡：微信绿 */
  --bubble-own-text: #191919;
  --ok: #07c160;
  --ok-bg: rgba(7,193,96,0.10);
  --warn: #d97706;
  --warn-bg: rgba(217,119,6,0.10);
  --err: #dc2626;
  --err-bg: rgba(220,38,38,0.08);
  --info: #2563eb;
  --info-bg: rgba(37,99,235,0.08);
  --purple: #7c3aed;
  --purple-bg: rgba(124,58,237,0.08);
  --urgent: #dc2626;
  --high: #ea580c;
  --medium: #2563eb;
  --low: #6b7280;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --sidebar-w: 64px;
  --font: "Inter","Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --mono: "JetBrains Mono","Cascadia Code","Fira Code",Consolas,monospace;
  --transition: 0.15s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg: #111213; --bg-elev: #191a1c; --bg-card: #1e1f22; --bg-hover: #242628;
  --bg-input: #242628; --border: #2c2d30; --border-strong: #3a3b3f;
  --text: #e8eaed; --text-sub: #a3a6ab; --text-mute: #6e7176;
  --accent: #07c160; --accent-hover: #0ad26a; --accent-bg: rgba(7,193,96,0.14);
  --accent-border: rgba(7,193,96,0.35);
  --rail-bg: #141517; --rail-text: #8f9297;
  --bubble-own: #2ea36a; --bubble-own-text: #eafff3;
  --ok: #34d399; --ok-bg: rgba(52,211,153,0.12);
  --err: #f87171; --err-bg: rgba(248,113,113,0.12);
  --info: #60a5fa; --info-bg: rgba(96,165,250,0.12);
  --purple: #c084fc; --purple-bg: rgba(192,132,252,0.12);
  --shadow: 0 4px 24px rgba(0,0,0,0.4); --shadow-lg: 0 12px 48px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.55;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }

/* ============ 登录页 ============ */
#login {
  height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(7,193,96,0.14), transparent), var(--bg);
}
.login-card {
  width: 380px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 16px; padding: 36px 32px 28px; box-shadow: var(--shadow);
  animation: fadeUp 0.4s ease;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.login-logo-wechat-guard {} .login-logo {
  width: 48px; height: 48px; border-radius: 12px;
  background: linear-gradient(135deg, #2bd86a, #059f4c);
  display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 20px;
}
.login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.login-card .sub { color: var(--text-sub); font-size: 13px; margin-bottom: 24px; }
.login-card label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; font-weight: 500; }
.login-card input {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text);
  font-family: var(--mono); font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.login-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.login-card .err { color: var(--err); font-size: 12px; margin-top: 8px; min-height: 16px; }
.login-foot { margin-top: 20px; font-size: 12px; color: var(--text-mute); text-align: center; }
.kbd-hint {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px;
  padding: 1px 6px; font-size: 11px; font-family: var(--mono); color: var(--text-sub);
}

/* ============ 布局 ============ */
#app { display: flex; height: 100vh; }
/* 微信式深色图标侧栏：亮色主题下也保持深色窄栏 */
.sidebar {
  width: var(--sidebar-w); background: var(--rail-bg); border-right: none;
  display: flex; flex-direction: column; flex-shrink: 0;
}
.sidebar-brand {
  padding: 14px 0 10px; display: flex; align-items: center; justify-content: center; border-bottom: none;
}
.sidebar-brand .logo {
  width: 36px; height: 36px; border-radius: 9px;
  background: linear-gradient(135deg, #07c160, #0aa856);
  display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(7,193,96,0.35);
}
.sidebar-brand .name { display: none; }
.sidebar-brand .ver { display: none; }
.nav { padding: 8px 0; flex: 1; overflow-y: auto; }
.nav-section { display: none; }
.nav-item {
  display: flex; align-items: center; justify-content: center; gap: 0;
  padding: 12px 0; border-radius: 0;
  color: var(--rail-text); cursor: pointer; font-size: 13px; font-weight: 500;
  transition: background var(--transition), color var(--transition);
  margin: 1px 8px; border-radius: 10px; position: relative;
}
.nav-item:hover { background: rgba(255,255,255,0.08); color: #e6e6e6; }
.nav-item.active { background: rgba(255,255,255,0.12); color: var(--rail-text-active); }
.nav-item.active::before {
  content: ''; position: absolute; left: -8px; top: 10px; bottom: 10px;
  width: 3px; border-radius: 2px; background: var(--accent);
}
.nav-item .icon { width: 22px; text-align: center; font-size: 20px; flex-shrink: 0; }
.nav-item span:not(.icon):not(.badge) { display: none; }
.nav-item .badge {
  position: absolute; top: 5px; right: 6px; margin: 0; background: var(--err); color: #fff;
  font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 9px; min-width: 16px; text-align: center;
  border: 2px solid var(--rail-bg); box-sizing: content-box;
}
.sidebar-footer {
  padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.sidebar-footer .avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0;
}
.sidebar-footer .info { display: none; }
.sidebar-footer button {
  background: none; border: none; color: var(--rail-text);
  border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 14px;
}
.sidebar-footer button:hover { color: var(--err); background: rgba(255,255,255,0.08); }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 52px; background: var(--bg-elev); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 24px; gap: 12px; flex-shrink: 0;
}
.topbar .title { font-size: 16px; font-weight: 700; }
.topbar .spacer { flex: 1; }
.topbar .status-pill {
  display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-sub);
  background: var(--bg-card); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px;
}
.topbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-mute); }
.topbar .dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.topbar .icon-btn {
  background: none; border: 1px solid var(--border); color: var(--text-sub);
  border-radius: 6px; width: 32px; height: 32px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  transition: all var(--transition); position: relative;
}
.topbar .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
.topbar .icon-btn .notif-dot {
  position: absolute; top: -2px; right: -2px; width: 8px; height: 8px;
  background: var(--err); border-radius: 50%; border: 2px solid var(--bg-elev);
}
.search-trigger {
  display: flex; align-items: center; gap: 8px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px;
  color: var(--text-mute); font-size: 13px; cursor: pointer; min-width: 200px;
  transition: border-color var(--transition);
}
.search-trigger:hover { border-color: var(--border-strong); }
.search-trigger .kbd { margin-left: auto; }

.content { flex: 1; overflow-y: auto; padding: 24px; }
.page-header { margin-bottom: 20px; }
.page-header h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.page-header p { color: var(--text-sub); font-size: 13px; }

/* ============ 组件 ============ */
.card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px; transition: border-color var(--transition);
}
.card:hover { border-color: var(--border-strong); }
.card-title {
  font-size: 12px; font-weight: 600; color: var(--text-sub); text-transform: uppercase;
  letter-spacing: 0.04em; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm); padding: 8px 16px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background var(--transition), transform .05s; font-family: inherit;
}
.btn:hover { background: var(--accent-hover); }
.btn:active { transform: scale(0.97); }
.btn.ghost { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); }
.btn.ghost:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.btn.danger { background: var(--err-bg); color: var(--err); border: 1px solid var(--err); }
.btn.danger:hover { background: var(--err); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.icon-only { padding: 6px 8px; }

.input, .select, .textarea {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 12px; color: var(--text); font-size: 13px; font-family: inherit; outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.textarea { resize: vertical; min-height: 60px; width: 100%; font-family: inherit; }
.select { cursor: pointer; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600; background: var(--bg-hover); color: var(--text-sub);
}
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.err { background: var(--err-bg); color: var(--err); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.purple { background: var(--purple-bg); color: var(--purple); }
.chip.accent { background: var(--accent-bg); color: var(--accent); }
.chip.urgent { background: var(--err-bg); color: var(--urgent); }
.chip.high { background: rgba(251,146,60,0.12); color: var(--high); }
.chip.medium { background: var(--info-bg); color: var(--medium); }
.chip.low { background: var(--bg-hover); color: var(--low); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; position: relative; overflow: hidden; transition: transform var(--transition), border-color var(--transition);
}
.stat-card:hover { transform: translateY(-2px); border-color: var(--border-strong); }
.stat-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--accent); opacity: 0.6;
}
.stat-card.ok::after { background: var(--ok); }
.stat-card.warn::after { background: var(--warn); }
.stat-card.purple::after { background: var(--purple); }
.stat-card.err::after { background: var(--err); }
.stat-card .label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
.stat-card .value { font-size: 28px; font-weight: 700; font-family: var(--mono); }
.stat-card .sub { font-size: 11px; color: var(--text-mute); margin-top: 4px; }

/* 看板 */
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.board-col {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  min-height: 200px; display: flex; flex-direction: column;
}
.board-col.drag-over { border-color: var(--accent); background: var(--accent-bg); }
.board-col-head {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;
}
.board-col-head .count {
  background: var(--bg-hover); color: var(--text-sub); font-size: 11px;
  padding: 1px 8px; border-radius: 10px; font-family: var(--mono);
}
.board-col-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.task-card {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px; cursor: grab; transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
}
.task-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.task-card.dragging { opacity: 0.4; transform: scale(0.98); }
.task-card .t-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.task-card .t-title { font-weight: 600; font-size: 13px; word-break: break-word; cursor: pointer; }
.task-card .t-title:hover { color: var(--accent); }
.task-card .t-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task-card .t-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-mute); }
.task-card .t-actions { display: flex; gap: 6px; margin-top: 8px; }
.task-card .t-labels { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.task-card .due-overdue { color: var(--err); font-weight: 600; }

/* 时间线 */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding-bottom: 16px; }
.tl-item::before {
  content: ''; position: absolute; left: -21px; top: 5px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--bg-card); border: 2px solid var(--accent);
}
.tl-item.ok::before { border-color: var(--ok); }
.tl-item.warn::before { border-color: var(--warn); }
.tl-item.err::before { border-color: var(--err); }
.tl-item.purple::before { border-color: var(--purple); }
.tl-item.info::before { border-color: var(--info); }
.tl-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.tl-type { font-size: 11px; font-weight: 700; font-family: var(--mono); color: var(--text-sub); }
.tl-time { font-size: 11px; color: var(--text-mute); font-family: var(--mono); }
.tl-body { font-size: 13px; color: var(--text); }
.tl-body .author { color: var(--accent); font-weight: 600; }

/* 表格 */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--text-sub); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg-hover); }

/* 上下文条目 */
.ctx-item {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px; margin-bottom: 10px; transition: border-color var(--transition);
}
.ctx-item:hover { border-color: var(--border-strong); }
.ctx-item .ctx-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ctx-item .ctx-title { font-weight: 600; font-size: 14px; }
.ctx-item .ctx-body { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
.ctx-item .ctx-meta { font-size: 11px; color: var(--text-mute); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* Toast */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg-card); border: 1px solid var(--border-strong); color: var(--text);
  padding: 10px 20px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow-lg);
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 9999; max-width: 80%;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.ok { border-color: var(--ok); }
#toast.err { border-color: var(--err); }

/* 空状态 */
.empty { text-align: center; padding: 40px 20px; color: var(--text-mute); }
.empty .icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }
.empty .text { font-size: 13px; }

/* 骨架屏 */
.skeleton { background: linear-gradient(90deg, var(--bg-hover) 25%, var(--bg-card) 50%, var(--bg-hover) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.form-row .input { flex: 1; min-width: 140px; }

/* 模态 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 12px;
  padding: 24px; width: 560px; max-width: 92vw; max-height: 85vh; overflow-y: auto;
  box-shadow: var(--shadow-lg); animation: modalIn 0.2s cubic-bezier(0.4,0,0.2,1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal h3 { margin-bottom: 16px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.modal.large { width: 720px; }

/* 命令面板 */
.cmd-palette {
  position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
  width: 560px; max-width: 92vw; background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 2000; overflow: hidden;
  animation: cmdIn 0.15s ease;
}
@keyframes cmdIn { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.cmd-input {
  width: 100%; padding: 14px 16px; background: transparent; border: none; border-bottom: 1px solid var(--border);
  color: var(--text); font-size: 15px; outline: none; font-family: inherit;
}
.cmd-results { max-height: 360px; overflow-y: auto; }
.cmd-item {
  padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border); transition: background var(--transition);
}
.cmd-item:hover, .cmd-item.selected { background: var(--accent-bg); }
.cmd-item .cmd-icon { width: 24px; text-align: center; font-size: 14px; }
.cmd-item .cmd-text { flex: 1; font-size: 13px; }
.cmd-item .cmd-text .sub { font-size: 11px; color: var(--text-mute); }
.cmd-item .cmd-kbd { font-size: 11px; color: var(--text-mute); font-family: var(--mono); }
.cmd-footer { padding: 8px 16px; font-size: 11px; color: var(--text-mute); border-top: 1px solid var(--border); display: flex; gap: 16px; }

/* 评论 */
.comment { padding: 12px 0; border-bottom: 1px solid var(--border); }
.comment:last-child { border-bottom: none; }
.comment .c-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.comment .c-author { font-weight: 600; font-size: 13px; color: var(--accent); }
.comment .c-time { font-size: 11px; color: var(--text-mute); font-family: var(--mono); }
.comment .c-body { font-size: 13px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
.comment .c-deleted { color: var(--text-mute); font-style: italic; font-size: 12px; }

/* Markdown 渲染 */
.md h1, .md h2, .md h3 { margin: 12px 0 8px; font-weight: 700; }
.md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; }
.md p { margin: 6px 0; }
.md code {
  background: var(--bg-input); padding: 1px 6px; border-radius: 4px;
  font-family: var(--mono); font-size: 12px; color: var(--purple);
}
.md pre {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px; overflow-x: auto; margin: 8px 0;
}
.md pre code { background: none; padding: 0; color: var(--text); }
.md ul, .md ol { margin: 6px 0; padding-left: 24px; }
.md li { margin: 2px 0; }
.md blockquote {
  border-left: 3px solid var(--accent); padding-left: 12px; margin: 8px 0;
  color: var(--text-sub);
}
.md a { color: var(--accent); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md strong { font-weight: 700; }
.md em { font-style: italic; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

/* 图表容器 */
.chart-container { width: 100%; }
.chart-container svg { width: 100%; height: auto; }

/* 通知面板 */
.notif-panel {
  position: fixed; top: 52px; right: 24px; width: 340px; background: var(--bg-card);
  border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow-lg);
  z-index: 1500; max-height: 400px; overflow-y: auto; animation: fadeIn 0.15s ease;
}
.notif-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background var(--transition); }
.notif-item:hover { background: var(--bg-hover); }
.notif-item .n-type { font-size: 10px; font-weight: 700; font-family: var(--mono); color: var(--text-mute); text-transform: uppercase; }

/* 响应式 */
@media (max-width: 900px) {

  .sidebar-brand .name, .sidebar-brand .ver, .nav-item span:not(.icon):not(.badge), .nav-section, .sidebar-footer .info { display: none; }

/* ---------- 消息页（微信式双栏会话） ---------- */
.msg-layout { display: flex; height: calc(100vh - 100px); min-height: 420px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.msg-side { width: 250px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid var(--border); background: var(--bg-elev); display: flex; flex-direction: column; }

.msg-chan .ava {

}

<script>
'use strict';
/* ============================================================
   CoAgent Hub v0.5 管理面板 — 现代化控制台
   零依赖：fetch + WebSocket + 原生 DOM + 手绘 SVG 图表
   ============================================================ */

const $ = (id) => document.getElementById(id);
const TOKEN_KEY = 'coagent_token_v2';
let TOKEN = sessionStorage.getItem(TOKEN_KEY) || '';
let ME = null, HEALTH = null, PAGE = 'dashboard', WS = null;
let WS_RECONNECT = 0, POLL_TIMER = null, LAST_SEQ = 0;
let CACHE = { tasks: [], context: [], reviews: [], branches: [], users: [], events: [], messages: [], stats: null };
let EMBED_BADGE = '🧠 检测中…';
/* 消息页状态 */
let MSG_CHANNEL = 'general';
let MSG_UNREAD = 0;
let MSG_LOADED = false;

/** 拉取语义检索状态，更新徽标文案（Ollama 未启用/不可用时如实显示） */
async function loadEmbedBadge() {
  try {
    const s = await api('GET', '/embed/status');
    if (!s.available) {
      EMBED_BADGE = s.config?.enabled === false ? '🧠 语义检索已关闭' : '🧠 语义检索未连接';
    } else {
      const pct = s.coverage.total ? Math.round((s.coverage.embedded / s.coverage.total) * 100) : 0;
      EMBED_BADGE = `🧠 ${esc(s.model)} · 已索引 ${pct}%`;
    }
  } catch { EMBED_BADGE = '🧠 语义检索未连接'; }
  const el = $('cx-embed-badge');
  if (el) el.textContent = EMBED_BADGE;
  const el2 = $('set-embed');
  if (el2) el2.textContent = EMBED_BADGE;
}
let UNREAD_COUNT = 0;
let DESKTOP_NOTIF = localStorage.getItem('coagent_desktop_notif') === '1';

/** 请求桌面通知权限并显示通知 */
async function enableDesktopNotif() {
  if (!('Notification' in window)) { toast('浏览器不支持桌面通知', 'err'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') { DESKTOP_NOTIF = true; localStorage.setItem('coagent_desktop_notif', '1'); toast('桌面通知已开启', 'ok'); }
  else toast('通知权限被拒绝', 'err');
}
function showDesktopNotif(title, body) {
  if (!DESKTOP_NOTIF || !('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">👑</text></svg>' }); } catch { /* 忽略 */ }
}

/* ---------- 工具 ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dt = (s) => { if (!s) return '—'; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); };
const timeAgo = (s) => { if (!s) return ''; const diff = (Date.now() - new Date(s).getTime()) / 1000; if (diff < 60) return '刚刚'; if (diff < 3600) return Math.floor(diff/60)+' 分钟前'; if (diff < 86400) return Math.floor(diff/3600)+' 小时前'; return Math.floor(diff/86400)+' 天前'; };
const shortId = (id) => String(id || '').slice(0, 8);
const toast = (msg, type = '') => { const t = $('toast'); t.textContent = msg; t.className = 'show ' + type; clearTimeout(t._t); t._t = setTimeout(() => { t.className = ''; }, 3000); };
async function api(method, url, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const text = await res.text();
  let data; try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
  if (!res.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + res.status));
  return data;
}

/* ---------- 极简 Markdown 渲染 ---------- */
function renderMarkdown(text) {
  if (!text) return '';
  let html = esc(text);
  // 代码块
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code}</code></pre>`);
  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 标题
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // 粗体和斜体
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // 链接：只放行安全协议（http/https/mailto/站内相对路径），
  // 拦截 javascript: 等伪协议——正文先经过 esc()，这里无法逃出属性，但协议本身会原样进 href
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, txt, href) => {
    const h = href.trim();
    if (/^(https?:\/\/|mailto:|\/|\.\/|#)/i.test(h)) {
      return `<a href="${h}" target="_blank" rel="noopener noreferrer">${txt}</a>`;
    }
    return m; // 非白名单协议：保持原样（已转义），渲染为普通文本
  });
  // 引用
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // 分割线
  html = html.replace(/^---$/gm, '<hr>');
  // 无序列表
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => '<ul>' + m + '</ul>');
  // 有序列表
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // 段落（剩余非空行）
  html = html.replace(/^(?!<(h[1-3]|ul|ol|li|pre|blockquote|hr|p))/gm, '<p>');
  html = html.replace(/<\/p>\n<p>/g, '</p><p>');
  return '<div class="md">' + html + '</div>';
}

/* ---------- SVG 图表 ---------- */
function barChart(data, opts = {}) {
  const w = opts.width || 320, h = opts.height || 140, pad = 30;
  const max = Math.max(...data.map((d) => d.value), 1);
  const bw = (w - pad * 2) / data.length * 0.6;
  const gap = (w - pad * 2) / data.length * 0.4;
  let bars = '';
  data.forEach((d, i) => {
    const bh = (d.value / max) * (h - pad * 2);
    const x = pad + i * (bw + gap) + gap / 2;
    const y = h - pad - bh;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${d.color || 'var(--accent)'}" opacity="0.8">
      <animate attributeName="height" from="0" to="${bh}" dur="0.4s" fill="freeze"/>
      <animate attributeName="y" from="${h-pad}" to="${y}" dur="0.4s" fill="freeze"/>
    </rect>`;
    bars += `<text x="${x + bw/2}" y="${h - pad + 14}" text-anchor="middle" fill="var(--text-mute)" font-size="10">${d.label}</text>`;
    if (d.value > 0) bars += `<text x="${x + bw/2}" y="${y - 4}" text-anchor="middle" fill="var(--text-sub)" font-size="10" font-weight="600">${d.value}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/>
    ${bars}
  </svg>`;
}

function donutChart(data, opts = {}) {
  const size = opts.size || 140, r = size / 2 - 12, cx = size / 2, cy = size / 2;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  let angle = -Math.PI / 2, segments = '';
  data.forEach((d) => {
    if (d.value === 0) return;
    const a2 = angle + (d.value / total) * Math.PI * 2;
    const large = (a2 - angle) > Math.PI ? 1 : 0;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    segments += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${d.color}" opacity="0.85"/>`;
    angle = a2;
  });
  const legend = data.map((d) =>
    `<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0">
      <span style="width:10px;height:10px;border-radius:2px;background:${d.color};display:inline-block"></span>
      <span style="color:var(--text-sub)">${d.label}</span>

// 「双击直达」：coagent.exe app 用 #token= 传递凭证，进面板立即消费并从地址栏清除
// （fragment 不会进服务器访问日志，也不会留在浏览器历史）
(function consumeHashToken() {
  const m = location.hash.match(/^#token=([A-Za-z0-9_.\-]+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  $('token-in').value = decodeURIComponent(m[1]);
  login();
})();

/* ---------- WebSocket ---------- */
function connectWS() {
  if (WS) { try { WS.close(); } catch {} }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try { WS = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(TOKEN)}&since=${LAST_SEQ}`); }
  catch { setWsStatus('不可用', false); return; }
  WS.onopen = () => { WS_RECONNECT = 0; setWsStatus('实时连接', true); };
  WS.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'hello') { LAST_SEQ = msg.lastSeq || LAST_SEQ; updateSeq(); return; }
    if (msg.seq) {
      LAST_SEQ = Math.max(LAST_SEQ, msg.seq);
      updateSeq();
      UNREAD_COUNT++;
      updateNotifDot();
      // 消息页：实时追加聊天气泡；不在消息页则累计未读
      if (msg.type === 'message.posted') {
        if (!CACHE.messages.some((m) => m.seq === msg.seq)) CACHE.messages.push(msg);
        if (PAGE === 'messages') appendMsgBubble(msg);
        else { MSG_UNREAD++; updateMsgBadge(); }
      }
      // 桌面通知：仅对重要事件
      if (DESKTOP_NOTIF && document.visibilityState !== 'visible') {
        const notifMap = {
          'task.created': '新任务', 'task.claimed': '任务被认领',
          'context.appended': '新上下文', 'review.requested': '新 PR 审核',
          'review.approved': 'PR 已批准', 'comment.posted': '新评论',
          'branch.pushed': '代码推送', 'message.posted': '新消息',
        };
        if (notifMap[msg.type]) showDesktopNotif(notifMap[msg.type], msg.payload?.title || msg.payload?.text || msg.payload?.branch || '');
      }
    }
    if (PAGE === 'activity' || PAGE === 'dashboard') renderCurrent();
    updateBadges();
  };
  WS.onclose = () => { setWsStatus('重连中…', false); WS_RECONNECT++; setTimeout(connectWS, Math.min(1000 * 2**WS_RECONNECT, 15000)); };
  WS.onerror = () => { try { WS.close(); } catch {} };
}
const setWsStatus = (t, live) => { $('ws-status').textContent = t; $('ws-dot').className = 'dot' + (live ? ' live' : ''); };
const updateSeq = () => { $('seq-display').textContent = 'seq ' + LAST_SEQ; };
const updateNotifDot = () => { $('notif-dot').style.display = UNREAD_COUNT > 0 ? '' : 'none'; };

/* ---------- 数据刷新 ---------- */
async function refreshAll() {
  try {

      api('GET', '/healthz'), api('GET', '/tasks'), api('GET', '/context?limit=50'),
      api('GET', '/reviews'), api('GET', '/branches'), api('GET', '/stats'),
    ]);
    HEALTH = h; LAST_SEQ = h.lastSeq; updateSeq();
    CACHE.tasks = tasks.tasks; CACHE.context = ctx.entries; CACHE.reviews = rev.reviews;
    CACHE.branches = br.branches; CACHE.stats = stats;
    if (stats.onlineUsers) $('online-count').textContent = stats.onlineUsers.length;
    loadEmbedBadge();

    // 消息页由 WS 实时驱动 + 输入框需要保留焦点，不做定时全量重绘
    if (PAGE !== 'messages') renderCurrent();
  } catch (e) { if (String(e.message).includes('401')) logout(); }

function updateBadges() {

let CTX_PENDING_FILES = []; // 待上传的文件 {file, meta?}

function emptyCol(text) { return `<div class="empty"><div class="text">${text}</div></div>`; }

    </div>

function dropTask(e, status) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!DRAG_TASK_ID) return;
  const id = DRAG_TASK_ID;
  DRAG_TASK_ID = null;
  // 认领 / 释放走专用接口（服务端 PATCH 已禁止携带 assignee），done 等纯状态走 PATCH
  const req = status === 'claimed' ? api('POST', `/tasks/${id}/claim`)
    : status === 'open' ? api('POST', `/tasks/${id}/release`, {})
    : api('PATCH', `/tasks/${id}`, { status });
  req.then(() => { toast('任务已移动', 'ok'); refreshAll(); })
    .catch((err) => { toast('✗ ' + err.message, 'err'); });
}
function createTask() {
  const title = $('tk-title').value.trim();
  if (!title) return toast('标题不能为空', 'err');
  const body = { title, description: $('tk-desc').value.trim(), priority: $('tk-priority').value };
  const due = $('tk-due').value;
  if (due) body.dueDate = new Date(due).toISOString();
  api('POST', '/tasks', body).then(() => { toast('任务已创建', 'ok'); $('tk-title').value = ''; $('tk-desc').value = ''; $('tk-due').value = ''; refreshAll(); })
    .catch((e) => toast('✗ ' + e.message, 'err'));
}
function claimTask(id) { api('POST', `/tasks/${id}/claim`).then(() => { toast('已认领', 'ok'); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err')); }
function doneTask(id) { api('PATCH', `/tasks/${id}`, { status: 'done' }).then(() => { toast('已标记完成', 'ok'); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err')); }
function toggleBatchMode() { BATCH_MODE = !BATCH_MODE; BATCH_SELECTED.clear(); renderTasks(); }
function toggleTaskSelect(id, checked) { if (checked) BATCH_SELECTED.add(id); else BATCH_SELECTED.delete(id); renderTasks(); }
async function batchAction(action, value) {
  if (!BATCH_SELECTED.size) return toast('未选择任务', 'err');
  if (action === 'delete' && !confirm(`确定删除选中的 ${BATCH_SELECTED.size} 个任务？`)) return;
  let ok = 0, fail = 0;
  for (const id of BATCH_SELECTED) {
    try {
      if (action === 'done') await api('PATCH', `/tasks/${id}`, { status: 'done' });
      else if (action === 'priority') await api('PATCH', `/tasks/${id}`, { priority: value });
      else if (action === 'delete') await api('DELETE', `/tasks/${id}`);
      ok++;
    } catch { fail++; }
  }
  toast(`批量操作完成：成功 ${ok}，失败 ${fail}`, fail ? 'err' : 'ok');
  BATCH_SELECTED.clear();
  BATCH_MODE = false;
  refreshAll();
}

/* ============================================================
   消息（聊天）—— 群聊消息的可视化，WS 实时驱动
   ============================================================ */
function msgChannels() {
  const set = new Set(['general']);
  for (const m of CACHE.messages) {
    const ch = m.payload?.channel;
    if (ch) set.add(ch);
  }
  return [...set];
}
function updateMsgBadge() {
  const b = $('badge-msgs');
  if (MSG_UNREAD > 0) { b.style.display = ''; b.textContent = MSG_UNREAD; }
  else b.style.display = 'none';
}
function msgBubbleHTML(ev) {
  const own = ev.authorId === ME.userId;
  const text = esc(ev.payload?.text || '').replace(/\n/g, '<br>');
  const ch = ev.payload?.channel || 'general';
  const chTag = ch !== 'general' && ch !== MSG_CHANNEL ? `<span class="chip" style="font-size:10px;margin-left:4px">${esc(ch)}</span>` : '';
  return `
    <div class="msg-row ${own ? 'own' : ''}">
      <div class="msg-avatar">${esc((ev.authorId || '?').charAt(0).toUpperCase())}</div>
      <div class="msg-body">
        <div class="msg-meta">${own ? '我' : esc(ev.authorId)} · ${timeAgo(ev.ts)}${chTag}</div>
        <div class="msg-bubble">${text || '<span style="color:var(--text-mute)">（空消息）</span>'}</div>
      </div>
    </div>`;
}
function appendMsgBubble(ev) {
  const stream = $('msg-stream');
  if (!stream || (ev.payload?.channel || 'general') !== MSG_CHANNEL) return;
  stream.insertAdjacentHTML('beforeend', msgBubbleHTML(ev));
  stream.scrollTop = stream.scrollHeight;
}
async function loadMessages() {
  try {
    const r = await api('GET', '/events?type=message.posted&after=0&limit=2000');
    CACHE.messages = r.events || [];
    MSG_LOADED = true;
  } catch { /* 降级：只用 WS 实时收到的 */ }
}
async function renderMessages() {
  if (!MSG_LOADED) await loadMessages();
  MSG_UNREAD = 0;
  updateMsgBadge();
  // 微信式双栏：左侧会话列表（频道 + 最近一条预览），右侧当前频道的对话
  const rows = msgChannels().map((ch) => {
    const msgs = CACHE.messages.filter((m) => (m.payload?.channel || 'general') === ch);
    const last = msgs[msgs.length - 1];
    return { ch, count: msgs.length, preview: last?.payload?.text || '还没有消息', time: last ? timeAgo(last.ts) : '' };
  });
  const list = CACHE.messages.filter((m) => (m.payload?.channel || 'general') === MSG_CHANNEL);
  const chLabel = MSG_CHANNEL === 'general' ? '🏠 全组大厅' : '📌 ' + esc(MSG_CHANNEL);
  $('content').innerHTML = `
    <div class="msg-layout">
      <div class="msg-side">
        <div class="side-title">消息 (${CACHE.messages.length})</div>
        ${rows.map((r) => `
          <div class="msg-chan ${r.ch === MSG_CHANNEL ? 'active' : ''}" onclick="switchChannel('${esc(r.ch)}')">
            <div class="ava">${r.ch === 'general' ? '🏠' : '📌'}</div>
            <div class="meta">
              <div class="n">${esc(r.ch)}</div>
              <div class="preview">${esc(r.preview)}</div>
            </div>
            <span class="time">${esc(r.time)}</span>
          </div>`).join('')}
      </div>
      <div class="msg-main">
        <div class="msg-chat-head">${chLabel}<span class="sub">· ${list.length} 条消息 · Enter 发送</span></div>
        <div class="msg-stream" id="msg-stream">
          ${list.length ? list.map(msgBubbleHTML).join('') : '<div class="empty-chan">还没有消息，打个招呼吧 👋</div>'}
        </div>
        <div class="msg-inputbar">
          <input class="input" id="msg-input" placeholder="发消息到 #${esc(MSG_CHANNEL)} …"
                 onkeydown="if(event.key==='Enter'){sendMsg()}">
          <button class="btn" onclick="sendMsg()">发送</button>
        </div>
      </div>
    </div>`;
  const stream = $('msg-stream');
  if (stream) stream.scrollTop = stream.scrollHeight;
  $('msg-input').focus();
}
function switchChannel(ch) { MSG_CHANNEL = ch; renderMessages(); }
async function sendMsg() {
  const input = $('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    await api('POST', '/messages', { text, channel: MSG_CHANNEL });
    // WS 会推回自己发的消息并追加气泡；网络不佳时这里兜底重拉
    setTimeout(() => { if (PAGE === 'messages') loadMessages().then(() => { if (PAGE === 'messages') renderMessages(); }); }, 800);
  } catch (e) {
    input.value = text;
    toast('✗ ' + e.message, 'err');
  }
}

async function postCtx() {
  const title = $('cx-title').value.trim();
  if (!title) return toast('标题不能为空', 'err');
  // 先上传待处理的文件
  const attachments = [];
  for (const f of CTX_PENDING_FILES) {
    try {
      const meta = await uploadFile(f);
      attachments.push(meta.id);
    } catch (e) { toast('✗ 文件上传失败: ' + f.name, 'err'); return; }
  }
  const tags = $('cx-tags').value.split(',').map((t) => t.trim()).filter(Boolean);
  api('POST', '/context', {
    type: $('cx-type').value || 'note', title,
    body: $('cx-body').value.trim(),
    tags, attachments,
  }).then(() => {
    toast('已上墙，全组可见', 'ok');
    $('cx-title').value = ''; $('cx-body').value = ''; $('cx-tags').value = '';
    CTX_PENDING_FILES = []; updatePendingFiles();
    refreshAll();
  }).catch((e) => toast('✗ ' + e.message, 'err'));
}
function handleCtxFiles(fileList) {
  for (const f of fileList) CTX_PENDING_FILES.push(f);
  updatePendingFiles();
}
function updatePendingFiles() {
  const el = $('cx-pending');
  if (!el) return;
  if (CTX_PENDING_FILES.length) {
    el.innerHTML = CTX_PENDING_FILES.map((f, i) =>
      `<span class="chip info" style="margin-right:4px">📎 ${esc(f.name)} (${(f.size/1024).toFixed(0)}KB)
        <span onclick="CTX_PENDING_FILES.splice(${i},1);updatePendingFiles()" style="cursor:pointer;margin-left:4px">✕</span></span>`
    ).join('');
  } else el.textContent = '';
}
async function uploadFile(file) {
  const buf = await file.arrayBuffer();
  const res = await fetch('/files', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': file.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(file.name) },
    body: buf,
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return (await res.json()).file;
}
function retractCtx(id) { if (!confirm('确定撤回？软删除，留痕。')) return; api('POST', `/context/${id}/retract`).then(() => { toast('已撤回', 'ok'); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err')); }
function pinCtx(id, pinned) { api('POST', `/context/${id}/pin`, { pinned }).then(() => { toast(pinned ? '已置顶' : '已取消置顶', 'ok'); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err')); }
function reviseCtx(id, oldTitle, oldBody) {
  const newBody = prompt('修订正文（Markdown）：', oldBody);
  if (newBody === null) return;
  api('POST', `/context/${id}/revise`, { body: newBody }).then(() => { toast('已修订', 'ok'); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err'));
}

/* ============================================================
   活动流
   ============================================================ */
async function renderActivity() {
  $('content').innerHTML = `<div class="page-header"><h2>活动流</h2><p>全系统事件时间线 · 实时推送</p></div>
    <div class="card"><div id="activity-list"><div class="skeleton" style="height:200px"></div></div></div>`;
  try {
    const { events } = await api('GET', '/events?after=0&limit=200');
    CACHE.events = events;
    const list = events.slice().reverse().slice(0, 80);
    $('activity-list').innerHTML = list.length ? `<div class="timeline">${list.map(eventTimelineItem).join('')}</div>` : '<div class="empty"><div class="icon">⚡</div><div class="text">暂无事件</div></div>';
  } catch (e) { $('activity-list').innerHTML = `<div class="empty"><div class="text">加载失败：${esc(e.message)}</div></div>`; }
}
function eventTimelineItem(ev) {
  const tc = { 'context.appended':'accent','context.retracted':'err','task.created':'info','task.claimed':'warn','task.updated':'info','task.released':'warn','branch.created':'purple','branch.pushed':'ok','branch.merged':'ok','review.requested':'warn','review.approved':'ok','review.rejected':'err','comment.posted':'info','comment.deleted':'err','message.posted':'info','agent.status':'' };
  let desc = ''; const p = ev.payload || {};
  switch (ev.type) {
    case 'context.appended': desc = `发布了「${p.title || ''}」`; break;
    case 'context.retracted': desc = `撤回了上下文 ${shortId(p.targetId || p.id)}`; break;
    case 'task.created': desc = `创建任务「${p.title || ''}」`; break;
    case 'task.claimed': desc = `认领了任务「${p.title || ''}」`; break;
    case 'task.updated': desc = `更新了任务 ${shortId(p.id)}（${(p.fields||[]).join(', ')}）`; break;
    case 'task.released': desc = `释放了任务 ${shortId(p.id)}${p.forced ? '（强制）' : ''}`; break;
    case 'branch.created': desc = `创建分支 ${p.branch}`; break;
    case 'branch.pushed': desc = `推送分支 ${p.branch} → ${(p.sha||'').slice(0,7)}`; break;
    case 'branch.merged': desc = `合并 ${p.branch} → ${p.base}`; break;
    case 'review.requested': desc = `发起 PR：${p.branch} → ${p.base}`; break;
    case 'review.approved': desc = `批准了 PR ${shortId(p.id)}`; break;
    case 'review.rejected': desc = `拒绝了 PR ${shortId(p.id)}`; break;
    case 'comment.posted': desc = `发表评论：${p.preview || ''}`; break;
    case 'comment.deleted': desc = `删除了评论 ${shortId(p.id)}`; break;
    case 'message.posted': desc = `说：${p.text || ''}`; break;
    case 'agent.status': desc = `上报状态：${JSON.stringify(p)}`; break;
    default: desc = JSON.stringify(p);
  }
  return `<div class="tl-item ${tc[ev.type] || ''}"><div class="tl-head"><span class="tl-type">#${ev.seq} ${esc(ev.type)}</span><span class="tl-time">${dt(ev.ts)} · ${timeAgo(ev.ts)}</span></div>
    <div class="tl-body"><span class="author">${esc(ev.authorId)}</span> ${esc(desc)}</div></div>`;
}

    <p style="font-size:11px;color:var(--warn);margin-top:10px">⚠ 泄露后用 rotate 换新，旧 token 立即失效。</p>
    <div class="actions"><button class="btn" onclick="closeModal()">我已复制</button></div>`);
}
function rotateUser(id) { if (!confirm(`轮换 ${id} 的 token？旧 token 立即失效。`)) return; api('POST', `/users/${id}/rotate`).then((r) => { showTokenModal(r.user.token, id); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err')); }
function delUser(id) { if (!confirm(`注销 ${id}？分支仍保留。`)) return; api('DELETE', `/users/${id}`).then(() => { toast('已注销', 'ok'); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err')); }

async function exportData() {
  try {
    const res = await fetch('/admin/export', { headers: { Authorization: 'Bearer ' + TOKEN } });
    if (!res.ok) throw new Error('导出失败（需管理员权限）');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `coagent-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
    toast('数据已导出', 'ok');
  } catch (e) { toast('✗ ' + e.message, 'err'); }
}

/* ============================================================
   模态框
   ============================================================ */
function showModal(html, size = '') {
  $('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal ${size}">${html}</div></div>`;
}
function closeModal() { $('modal-root').innerHTML = ''; }

/* ============================================================
   命令面板（Ctrl+K）
   ============================================================ */
let CMD_ITEMS = [], CMD_INDEX = 0;
function openCmd() {
  $('cmd-root').innerHTML = `<div class="cmd-palette">
    <input class="cmd-input" id="cmd-input" placeholder="搜索任务、上下文，或执行命令…" oninput="filterCmd(this.value)" onkeydown="cmdKey(event)">
    <div class="cmd-results" id="cmd-results"></div>
    <div class="cmd-footer"><span>↑↓ 导航</span><span>Enter 执行</span><span>Esc 关闭</span></div>
  </div>`;
  $('cmd-input').focus();
  filterCmd('');
}
function closeCmd() { $('cmd-root').innerHTML = ''; }
async function filterCmd(q) {
  q = q.trim();
  const items = [];
  // 快捷命令
  const actions = [
    { icon: '➕', text: '创建新任务', sub: '打开任务创建表单', action: () => { closeCmd(); nav('tasks'); } },
    { icon: '💬', text: '发布共享笔记', sub: '上下文上墙', action: () => { closeCmd(); nav('context'); } },
    { icon: '🔍', text: '发起 PR 审核', sub: '请求合入 main', action: () => { closeCmd(); nav('reviews'); } },
    { icon: '👤', text: '开户邀请同学', sub: '用户管理', action: () => { closeCmd(); nav('users'); } },
    { icon: '📊', text: '前往仪表盘', sub: '概览统计', action: () => { closeCmd(); nav('dashboard'); } },
    { icon: '⚡', text: '查看活动流', sub: '事件时间线', action: () => { closeCmd(); nav('activity'); } },
    { icon: '🌓', text: '切换主题', sub: '深色/浅色', action: () => { closeCmd(); toggleTheme(); } },
  ];
  for (const a of actions) { if (!q || a.text.includes(q) || a.sub.includes(q)) items.push(a); }
  // 搜索任务
  if (q) {
    try {
      const r = await api('GET', `/search?q=${encodeURIComponent(q)}&limit=5`);
      for (const t of r.tasks || []) items.push({ icon: '✅', text: t.title, sub: `任务 · ${t.status} · ${t.priority}`, action: () => { closeCmd(); openTaskDetail(t.id); } });
      for (const c of r.context || []) items.push({ icon: '💬', text: c.title, sub: `上下文 · ${c.type} · ${c.authorId}`, action: () => { closeCmd(); nav('context'); } });
    } catch {}
  }
  CMD_ITEMS = items; CMD_INDEX = 0;
  $('cmd-results').innerHTML = items.length ? items.map((it, i) =>
    `<div class="cmd-item ${i === 0 ? 'selected' : ''}" onclick="CMD_ITEMS[${i}].action()">
      <span class="cmd-icon">${it.icon}</span><span class="cmd-text">${esc(it.text)}<div class="sub">${esc(it.sub)}</div></span></div>`
  ).join('') : '<div class="empty" style="padding:20px"><div class="text">无匹配结果</div></div>';
}
function cmdKey(e) {
  const items = $('cmd-results').querySelectorAll('.cmd-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); CMD_INDEX = Math.min(CMD_INDEX + 1, CMD_ITEMS.length - 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); CMD_INDEX = Math.max(CMD_INDEX - 1, 0); }
  else if (e.key === 'Enter') { e.preventDefault(); CMD_ITEMS[CMD_INDEX]?.action(); return; }
  else if (e.key === 'Escape') { closeCmd(); return; }
  items.forEach((el, i) => el.classList.toggle('selected', i === CMD_INDEX));
  items[CMD_INDEX]?.scrollIntoView({ block: 'nearest' });
}

/* ============================================================
   通知面板
   ============================================================ */
function toggleNotif() {
  UNREAD_COUNT = 0; updateNotifDot();
  const recent = (CACHE.events || []).slice(-10).reverse();
  $('notif-root').innerHTML = `<div class="notif-panel">
    ${recent.length ? recent.map((e) => `<div class="notif-item" onclick="nav('activity')">
      <div class="n-type">${esc(e.type)}</div><div class="n-text">${esc(e.authorId)} · ${esc((e.payload?.title || e.payload?.branch || e.payload?.text || '').toString().slice(0, 50))}</div>
      <div class="n-time">${timeAgo(e.ts)}</div></div>`).join('') : '<div class="empty" style="padding:20px"><div class="text">暂无通知</div></div>'}
  </div>`;
  setTimeout(() => document.addEventListener('click', closeNotifOnce, { once: true }), 0);
}
function closeNotifOnce(e) { if (!$('.notif-panel')?.contains(e.target)) $('notif-root').innerHTML = ''; }

/* ============================================================
   键盘快捷键
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openCmd(); }
  else if (e.key === 'Escape') { closeCmd(); closeModal(); $('notif-root').innerHTML = ''; }
  else if (e.key === 'n' && !e.ctrlKey && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    e.preventDefault(); nav('tasks'); setTimeout(() => $('tk-title')?.focus(), 100);
  }
  else if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    e.preventDefault(); openCmd();
  }
});

/* ---------- 自动登录 ---------- */
if (TOKEN) { api('GET', '/me').then((me) => { ME = me; boot(); }).catch(() => { sessionStorage.removeItem(TOKEN_KEY); TOKEN = ''; }); }
