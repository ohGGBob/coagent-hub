<style>
/* ============ 设计令牌（v0.17 商业化视觉语言：宽侧栏 + 精致渐变 + 玻璃质感） ============ */
:root {
  --bg: #f2f4f7;
  --bg-elev: #fff;
  --bg-card: #fff;
  --bg-hover: #eef1f5;
  --bg-input: #f5f6f8;
  --border: #e4e7ec;
  --border-strong: #cfd4dc;
  --text: #16181d;
  --text-sub: #5f6b7a;
  --text-mute: #9aa3b0;
  --accent: #07c160;
  --accent-2: #00b894;
  --accent-hover: #06ad56;
  --accent-bg: rgba(7,193,96,0.10);
  --accent-border: rgba(7,193,96,0.30);
  --accent-grad: linear-gradient(135deg, #07c160 0%, #00b894 100%);
  --rail-bg: #101418;          /* 侧栏深底（两主题一致，营造专注感） */
  --rail-bg-2: #161b21;
  --rail-text: #9aa4b2;
  --rail-text-active: #ffffff;
  --bubble-own: #95ec69;
  --bubble-own-text: #191919;
  --ok: #07c160;
  --ok-bg: rgba(7,193,96,0.10);
  --warn: #d97706;
  --warn-bg: rgba(217,119,6,0.10);
  --err: #dc2626;
  --err-bg: rgba(220,38,38,0.08);
  --info: #2563eb;
  --info-bg: rgba(37,99,235,0.08);
  --purple: #7c3aed;
  --purple-bg: rgba(124,58,237,0.08);
  --urgent: #dc2626;
  --high: #ea580c;
  --medium: #2563eb;
  --low: #6b7280;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 18px;
  --shadow: 0 2px 10px rgba(22,24,29,0.05);
  --shadow-lg: 0 16px 48px rgba(22,24,29,0.14);
  --shadow-glow: 0 0 0 1px rgba(7,193,96,0.12), 0 8px 24px rgba(7,193,96,0.16);
  --sidebar-w: 224px;
  --font: "Inter","Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --mono: "JetBrains Mono","Cascadia Code","Fira Code",Consolas,monospace;
  --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg: #0e1013; --bg-elev: #14171b; --bg-card: #1a1d23; --bg-hover: #20242b;
  --bg-input: #20242b; --border: #262b33; --border-strong: #333a44;
  --text: #e8eaed; --text-sub: #9aa4b2; --text-mute: #616a76;
  --accent: #07c160; --accent-2: #00e5a0; --accent-hover: #0ad26a; --accent-bg: rgba(7,193,96,0.14);
  --accent-border: rgba(7,193,96,0.35);
  --accent-grad: linear-gradient(135deg, #07c160 0%, #00e5a0 100%);
  --rail-bg: #0b0d10; --rail-bg-2: #12151a;
  --rail-text: #8a93a1; --rail-text-active: #ffffff;
  --bubble-own: #2ea36a; --bubble-own-text: #eafff3;
  --ok: #34d399; --ok-bg: rgba(52,211,153,0.12);
  --err: #f87171; --err-bg: rgba(248,113,113,0.12);
  --info: #60a5fa; --info-bg: rgba(96,165,250,0.12);
  --purple: #c084fc; --purple-bg: rgba(192,132,252,0.12);
  --shadow: 0 4px 20px rgba(0,0,0,0.35); --shadow-lg: 0 16px 56px rgba(0,0,0,0.55);
  --shadow-glow: 0 0 0 1px rgba(7,193,96,0.2), 0 8px 28px rgba(7,193,96,0.2);
}

/* ============ 皮肤：科幻风（赛博霓虹） ============ */
html[data-skin="scifi"] {
  --bg: #05070d; --bg-elev: #0a0f18; --bg-card: #0d1420; --bg-hover: #141d2e; --bg-input: #0f1726;
  --border: #1b2637; --border-strong: #2c3f57;
  --text: #e2e8f0; --text-sub: #8ba1b8; --text-mute: #54687e;
  --accent: #22d3ee; --accent-2: #e879f9; --accent-hover: #38bdf8;
  --accent-bg: rgba(34,211,238,0.12); --accent-border: rgba(34,211,238,0.35);
  --accent-grad: linear-gradient(135deg, #22d3ee 0%, #e879f9 100%);
  --rail-bg: #03050a; --rail-bg-2: #0a101a;
  --rail-text: #74889e; --rail-text-active: #f0f9ff;
  --bubble-own: #0e7490; --bubble-own-text: #e0f2fe;
  --ok: #34d399; --ok-bg: rgba(52,211,153,0.12);
  --err: #fb7185; --err-bg: rgba(251,113,133,0.12);
  --info: #60a5fa; --info-bg: rgba(96,165,250,0.12);
  --purple: #c084fc; --purple-bg: rgba(192,132,252,0.12);
  --shadow: 0 4px 20px rgba(0,0,0,0.5); --shadow-lg: 0 16px 56px rgba(0,0,0,0.72);
  --shadow-glow: 0 0 0 1px rgba(34,211,238,0.25), 0 8px 28px rgba(34,211,238,0.22);
}
html[data-skin="scifi"] body {
  background-image:
    radial-gradient(ellipse 65% 45% at 85% -10%, rgba(34,211,238,0.07), transparent),
    radial-gradient(ellipse 45% 35% at 5% 110%, rgba(232,121,249,0.06), transparent);
}
html[data-skin="scifi"] .sidebar {
  background:
    linear-gradient(180deg, rgba(3,5,10,0.96), rgba(10,16,26,0.98)),
    repeating-linear-gradient(0deg, transparent 0 23px, rgba(34,211,238,0.04) 23px 24px);
}
html[data-skin="scifi"] .nav-item.active {
  background: linear-gradient(90deg, rgba(34,211,238,0.22), rgba(232,121,249,0.10));
  box-shadow: inset 0 0 0 1px rgba(34,211,238,0.35);
}
html[data-skin="scifi"] .stat-card::after { background: linear-gradient(90deg, #22d3ee, #e879f9); }

/* ============ 皮肤：可爱风（粉彩圆润） ============ */
html[data-skin="cute"] {
  --bg: #fff4f6; --bg-elev: #ffffff; --bg-card: #ffffff; --bg-hover: #ffe9ef; --bg-input: #fff4f6;
  --border: #ffd9e0; --border-strong: #ffc0cd;
  --text: #5b3a45; --text-sub: #a47886; --text-mute: #cfa6b2;
  --accent: #f472b6; --accent-2: #a78bfa; --accent-hover: #ec4899;
  --accent-bg: rgba(244,114,182,0.12); --accent-border: rgba(244,114,182,0.32);
  --accent-grad: linear-gradient(135deg, #f472b6 0%, #a78bfa 100%);
  --rail-bg: #7c2d4e; --rail-bg-2: #8e3a5f;
  --rail-text: #f6c8d8; --rail-text-active: #fff;
  --bubble-own: #f9a8d4; --bubble-own-text: #5b2a3d;
  --ok: #34d399; --ok-bg: rgba(52,211,153,0.14);
  --err: #f87171; --err-bg: rgba(248,113,113,0.12);
  --info: #60a5fa; --info-bg: rgba(96,165,250,0.14);
  --purple: #c084fc; --purple-bg: rgba(192,132,252,0.14);
  --radius: 16px; --radius-sm: 10px; --radius-lg: 26px;
  --shadow: 0 4px 16px rgba(244,114,182,0.10); --shadow-lg: 0 16px 48px rgba(244,114,182,0.18);
  --shadow-glow: 0 0 0 1px rgba(244,114,182,0.18), 0 8px 24px rgba(244,114,182,0.18);
}
html[data-skin="cute"] .nav-item.active {
  background: linear-gradient(90deg, rgba(244,114,182,0.24), rgba(167,139,250,0.12));
  box-shadow: inset 0 0 0 1px rgba(244,114,182,0.3);
}
html[data-skin="cute"] .stat-card::after { background: linear-gradient(90deg, #f472b6, #a78bfa); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.55;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }

/* ============ 登录页（v0.17：品牌渐变 + 特性亮点） ============ */
#login {
  height: 100vh; display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse 70% 50% at 20% -10%, rgba(7,193,96,0.16), transparent),
    radial-gradient(ellipse 60% 45% at 85% 110%, rgba(0,180,148,0.12), transparent),
    var(--bg);
}
.login-card {
  width: 400px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 40px 36px 30px; box-shadow: var(--shadow-lg);
  animation: fadeUp 0.45s cubic-bezier(0.2,0.8,0.2,1);
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
.login-logo-wechat-guard {} .login-logo {
  width: 56px; height: 56px; border-radius: 14px;
  display: block; margin-bottom: 22px;
  box-shadow: var(--shadow-glow);
}
.login-card h1 { font-size: 24px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.02em; }
.login-card .sub { color: var(--text-sub); font-size: 13px; margin-bottom: 22px; line-height: 1.6; }
.login-card label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
.login-card input {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 11px 14px; color: var(--text);
  font-family: var(--mono); font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.login-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.login-card .err { color: var(--err); font-size: 12px; margin-top: 8px; min-height: 16px; }
.login-foot { margin-top: 20px; font-size: 12px; color: var(--text-mute); text-align: center; }
.login-feats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
  margin: 18px 0 4px; padding: 14px 14px; background: var(--accent-bg);
  border: 1px solid var(--accent-border); border-radius: var(--radius-sm);
}
.login-feats div { font-size: 12px; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
.login-feats div::before { content: '✓'; color: var(--accent); font-weight: 800; }
.kbd-hint {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--bg-input); border: 1px solid var(--border); border-radius: 5px;
  padding: 1px 6px; font-size: 11px; font-family: var(--mono); color: var(--text-sub);
}

/* ============ 布局（v0.17：宽侧栏 + 玻璃顶栏） ============ */
#app { display: flex; height: 100vh; }
.sidebar {
  width: var(--sidebar-w); background: linear-gradient(180deg, var(--rail-bg) 0%, var(--rail-bg-2) 100%);
  display: flex; flex-direction: column; flex-shrink: 0;
  border-right: 1px solid rgba(255,255,255,0.04);
}
.sidebar-brand {
  padding: 20px 18px 16px; display: flex; align-items: center; gap: 12px;
}
.sidebar-brand .logo {
  width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
  box-shadow: var(--shadow-glow);
}
.sidebar-brand .name { color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 0.01em; }
.sidebar-brand .ver { color: var(--rail-text); font-size: 10.5px; margin-top: 2px; }
.nav { padding: 8px 12px 12px; flex: 1; overflow-y: auto; }
.nav-section {
  display: block; color: rgba(255,255,255,0.32); font-size: 10px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase; margin: 16px 10px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 10px;
  color: var(--rail-text); cursor: pointer; font-size: 13px; font-weight: 500;
  transition: background var(--transition), color var(--transition), transform var(--transition);
  margin-bottom: 2px; position: relative; user-select: none;
}
.nav-item:hover { background: rgba(255,255,255,0.07); color: #e8eaed; }
.nav-item:active { transform: scale(0.98); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(7,193,96,0.22), rgba(7,193,96,0.08));
  color: var(--rail-text-active); font-weight: 600;
  box-shadow: inset 0 0 0 1px rgba(7,193,96,0.25);
}
.nav-item .icon { width: 20px; text-align: center; font-size: 17px; flex-shrink: 0; filter: saturate(0.9); }
.nav-item span:not(.icon):not(.badge) { display: inline; }
.nav-item .badge {
  position: absolute; top: 6px; right: 10px; margin: 0; background: var(--err); color: #fff;
  font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 9px; min-width: 16px; text-align: center;
  border: 2px solid var(--rail-bg); box-sizing: content-box;
}
.sidebar-footer {
  padding: 14px 14px; border-top: 1px solid rgba(255,255,255,0.07);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-footer .avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--accent-grad); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(7,193,96,0.35);
}
.sidebar-footer .info { flex: 1; min-width: 0; }
.sidebar-footer .info .n { color: #fff; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-footer .info .id { color: var(--rail-text); font-size: 10.5px; margin-top: 1px; font-family: var(--mono); }
.sidebar-footer button {
  background: none; border: none; color: var(--rail-text);
  border-radius: 8px; padding: 6px 9px; cursor: pointer; font-size: 15px; transition: all var(--transition);
}
.sidebar-footer button:hover { color: var(--err); background: rgba(255,255,255,0.08); }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 56px; background: color-mix(in srgb, var(--bg-elev) 82%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 24px; gap: 10px; flex-shrink: 0;
  position: sticky; top: 0; z-index: 20;
}
.topbar .title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.topbar .spacer { flex: 1; }
.topbar .status-pill {
  display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-sub);
  background: var(--bg-card); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px;
  transition: border-color var(--transition);
}
.topbar .status-pill:hover { border-color: var(--border-strong); }
.topbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-mute); }
.topbar .dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.topbar .icon-btn {
  background: none; border: 1px solid var(--border); color: var(--text-sub);
  border-radius: 8px; width: 34px; height: 34px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  transition: all var(--transition);
}
.topbar .icon-btn:hover { background: var(--bg-hover); color: var(--text); transform: translateY(-1px); }
.topbar .icon-btn:active { transform: translateY(0) scale(0.96); }
.search-trigger {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  background: var(--bg-input); border: 1px solid var(--border); border-radius: 20px;
  padding: 7px 12px; font-size: 12.5px; color: var(--text-mute); width: 260px;
  transition: all var(--transition);
}
.search-trigger:hover { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-bg); }
.topbar .icon-btn { position: relative; }
.topbar .icon-btn .notif-dot {
  position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px; padding: 0 3px;
  background: var(--err); color: #fff; border-radius: 9px; border: 2px solid var(--bg-elev);
  font-size: 9px; font-weight: 800; line-height: 11px; text-align: center; box-sizing: content-box;
}

.content { flex: 1; overflow-y: auto; padding: 24px; }
.page-header { margin-bottom: 22px; }
.page-header h2 { font-size: 21px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.01em; }
.page-header p { color: var(--text-sub); font-size: 13px; }

/* ============ 组件 ============ */
.card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px; transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
}
.card:hover { border-color: var(--border-strong); box-shadow: 0 2px 10px rgba(22,24,29,0.04); }
.card-title {
  font-size: 12px; font-weight: 600; color: var(--text-sub); text-transform: uppercase;
  letter-spacing: 0.04em; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px; background: var(--accent-grad); color: #fff;
  border: none; border-radius: var(--radius-sm); padding: 8px 16px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all var(--transition); font-family: inherit;
  box-shadow: 0 2px 8px rgba(7,193,96,0.28);
}
.btn:hover { background: var(--accent-grad); filter: brightness(1.06); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(0.97); }
.btn.ghost { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
.btn.ghost:hover { background: var(--bg-hover); border-color: var(--border-strong); filter: none; }
.btn.danger { background: var(--err-bg); color: var(--err); border: 1px solid var(--err); box-shadow: none; }
.btn.danger:hover { background: var(--err); color: #fff; filter: none; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.icon-only { padding: 6px 8px; }

.input, .select, .textarea {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 12px; color: var(--text); font-size: 13px; font-family: inherit; outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.textarea { resize: vertical; min-height: 60px; width: 100%; font-family: inherit; }
.select { cursor: pointer; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600; background: var(--bg-hover); color: var(--text-sub);
}
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.err { background: var(--err-bg); color: var(--err); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.purple { background: var(--purple-bg); color: var(--purple); }
.chip.accent { background: var(--accent-bg); color: var(--accent); }
.skin-card.active { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-bg); }
/* Agent 人格徽章（独立视角标识） */
.persona-chip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; font-size: 10.5px; line-height: 1;
  border-radius: 50%; margin-left: 4px; vertical-align: -1px;
  background: var(--accent-bg); border: 1px solid var(--accent-border); cursor: default;
}
.chip.urgent { background: var(--err-bg); color: var(--urgent); }
.chip.high { background: rgba(251,146,60,0.12); color: var(--high); }
.chip.medium { background: var(--info-bg); color: var(--medium); }
.chip.low { background: var(--bg-hover); color: var(--low); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; position: relative; overflow: hidden; transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
}
.stat-card:hover { transform: translateY(-3px); border-color: var(--accent-border); box-shadow: var(--shadow); }
.stat-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--accent-grad); opacity: 0.85;
}
.stat-card.ok::after { background: var(--ok); }
.stat-card.warn::after { background: var(--warn); }
.stat-card.purple::after { background: var(--purple); }
.stat-card.err::after { background: var(--err); }
.stat-card .label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
.stat-card .value { font-size: 28px; font-weight: 700; font-family: var(--mono); }
.stat-card .sub { font-size: 11px; color: var(--text-mute); margin-top: 4px; }

/* 看板 */
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.board-col {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  min-height: 200px; display: flex; flex-direction: column;
}
.board-col.drag-over { border-color: var(--accent); background: var(--accent-bg); }
.board-col-head {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;
}
.board-col-head .count {
  background: var(--bg-hover); color: var(--text-sub); font-size: 11px;
  padding: 1px 8px; border-radius: 10px; font-family: var(--mono);
}
.board-col-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.task-card {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px; cursor: grab; transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
}
.task-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.task-card.dragging { opacity: 0.4; transform: scale(0.98); }
.task-card .t-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.task-card .t-title { font-weight: 600; font-size: 13px; word-break: break-word; cursor: pointer; }
.task-card .t-title:hover { color: var(--accent); }
.task-card .t-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task-card .t-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-mute); }
.task-card .t-actions { display: flex; gap: 6px; margin-top: 8px; }
.task-card .t-labels { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.task-card .due-overdue { color: var(--err); font-weight: 600; }

/* 时间线 */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding-bottom: 16px; }
.tl-item::before {
  content: ''; position: absolute; left: -21px; top: 5px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--bg-card); border: 2px solid var(--accent);
}
.tl-item.ok::before { border-color: var(--ok); }
.tl-item.warn::before { border-color: var(--warn); }
.tl-item.err::before { border-color: var(--err); }
.tl-item.purple::before { border-color: var(--purple); }
.tl-item.info::before { border-color: var(--info); }
.tl-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.tl-type { font-size: 11px; font-weight: 700; font-family: var(--mono); color: var(--text-sub); }
.tl-time { font-size: 11px; color: var(--text-mute); font-family: var(--mono); }
.tl-body { font-size: 13px; color: var(--text); }
.tl-body .author { color: var(--accent); font-weight: 600; }

/* 表格 */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--text-sub); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg-hover); }

/* 上下文条目 */
.ctx-item {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px; margin-bottom: 10px; transition: border-color var(--transition);
}
.ctx-item:hover { border-color: var(--border-strong); }
.ctx-item .ctx-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ctx-item .ctx-title { font-weight: 600; font-size: 14px; }
.ctx-item .ctx-body { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
.ctx-item .ctx-meta { font-size: 11px; color: var(--text-mute); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* Toast */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg-card); border: 1px solid var(--border-strong); color: var(--text);
  padding: 10px 20px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow-lg);
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 9999; max-width: 80%;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.ok { border-color: var(--ok); }
#toast.err { border-color: var(--err); }

/* 空状态 */
.empty { text-align: center; padding: 40px 20px; color: var(--text-mute); }
.empty .icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }
.empty .text { font-size: 13px; }

/* 骨架屏 */
.skeleton { background: linear-gradient(90deg, var(--bg-hover) 25%, var(--bg-card) 50%, var(--bg-hover) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.form-row .input { flex: 1; min-width: 140px; }

/* 模态 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 12px;
  padding: 24px; width: 560px; max-width: 92vw; max-height: 85vh; overflow-y: auto;
  box-shadow: var(--shadow-lg); animation: modalIn 0.2s cubic-bezier(0.4,0,0.2,1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal h3 { margin-bottom: 16px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.modal.large { width: 720px; }

/* 命令面板 */
.cmd-palette {
  position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
  width: 560px; max-width: 92vw; background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 2000; overflow: hidden;
  animation: cmdIn 0.15s ease;
}
@keyframes cmdIn { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.cmd-input {
  width: 100%; padding: 14px 16px; background: transparent; border: none; border-bottom: 1px solid var(--border);
  color: var(--text); font-size: 15px; outline: none; font-family: inherit;
}
.cmd-results { max-height: 360px; overflow-y: auto; }
.cmd-item {
  padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border); transition: background var(--transition);
}
.cmd-item:hover, .cmd-item.selected { background: var(--accent-bg); }
.cmd-item .cmd-icon { width: 24px; text-align: center; font-size: 14px; }
.cmd-item .cmd-text { flex: 1; font-size: 13px; }
.cmd-item .cmd-text .sub { font-size: 11px; color: var(--text-mute); }
.cmd-item .cmd-kbd { font-size: 11px; color: var(--text-mute); font-family: var(--mono); }
.cmd-footer { padding: 8px 16px; font-size: 11px; color: var(--text-mute); border-top: 1px solid var(--border); display: flex; gap: 16px; }

/* 评论 */
.comment { padding: 12px 0; border-bottom: 1px solid var(--border); }
.comment:last-child { border-bottom: none; }
.comment .c-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.comment .c-author { font-weight: 600; font-size: 13px; color: var(--accent); }
.comment .c-time { font-size: 11px; color: var(--text-mute); font-family: var(--mono); }
.comment .c-body { font-size: 13px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
.comment .c-deleted { color: var(--text-mute); font-style: italic; font-size: 12px; }

/* Markdown 渲染 */
.md h1, .md h2, .md h3 { margin: 12px 0 8px; font-weight: 700; }
.md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; }
.md p { margin: 6px 0; }
.md code {
  background: var(--bg-input); padding: 1px 6px; border-radius: 4px;
  font-family: var(--mono); font-size: 12px; color: var(--purple);
}
.md pre {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px; overflow-x: auto; margin: 8px 0;
}
.md pre code { background: none; padding: 0; color: var(--text); }
.md ul, .md ol { margin: 6px 0; padding-left: 24px; }
.md li { margin: 2px 0; }
.md blockquote {
  border-left: 3px solid var(--accent); padding-left: 12px; margin: 8px 0;
  color: var(--text-sub);
}
.md a { color: var(--accent); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md strong { font-weight: 700; }
.md em { font-style: italic; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

/* 图表容器 */
.chart-container { width: 100%; }
.chart-container svg { width: 100%; height: auto; }

/* 通知面板 */
.notif-panel {
  position: fixed; top: 60px; right: 24px; width: 350px; background: var(--bg-card);
  border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow-lg);
  z-index: 1500; overflow: hidden; animation: fadeIn 0.15s ease; display: flex; flex-direction: column;
}
.notif-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--bg-elev); }
.notif-scroll { max-height: 380px; overflow-y: auto; }
.notif-item { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background var(--transition); align-items: flex-start; }
.notif-item:hover { background: var(--bg-hover); }
.notif-item.unread { background: var(--accent-bg); }
.notif-item .n-icon { font-size: 16px; margin-top: 1px; flex-shrink: 0; }
.notif-item .n-body { flex: 1; min-width: 0; }
.notif-item .n-text { font-size: 12.5px; color: var(--text); word-break: break-word; }
.notif-item .n-meta { font-size: 10.5px; color: var(--text-mute); margin-top: 3px; }

/* 响应式 */
@media (max-width: 1100px) {
  .search-trigger { width: 180px; }
  .topbar .status-pill .pill-label { display: none; }
}
@media (max-width: 900px) {
  .board { grid-template-columns: 1fr; }
  .sidebar { width: 68px; }
  .sidebar-brand { justify-content: center; padding: 16px 0; }
  .sidebar-brand .name, .sidebar-brand .ver, .nav-item span:not(.icon):not(.badge), .nav-section, .sidebar-footer .info { display: none; }
  .nav { padding: 8px 8px 12px; }
  .nav-item { justify-content: center; padding: 10px 0; }
  .sidebar-footer { justify-content: center; padding: 12px 8px; }
  .sidebar-footer button { display: none; }
  .search-trigger { display: none; }
}

/* ---------- 消息页（微信式双栏会话） ---------- */
.msg-layout { display: flex; height: calc(100vh - 100px); min-height: 420px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

.msg-chan:hover { background: var(--bg-hover); }
.msg-chan.active { background: var(--bg-hover); border-left-color: var(--accent); }
.msg-chan .ava {

  background: linear-gradient(135deg, #07c160, #0aa856); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.msg-chan .meta { flex: 1; min-width: 0; }
.msg-chan .n { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.msg-chan .time { font-size: 10px; color: var(--text-mute); align-self: flex-start; margin-top: 2px; }
.msg-side .side-title { font-size: 12px; font-weight: 700; color: var(--text); padding: 14px 16px 10px; }
.msg-main { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
.msg-chat-head {
  height: 50px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 18px;
  background: var(--bg-elev); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 14px;
}
.msg-chat-head .sub { font-size: 11px; color: var(--text-mute); font-weight: 400; }
.msg-stream { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; }
.msg-row { display: flex; gap: 10px; align-items: flex-start; }
.msg-row.own { flex-direction: row-reverse; }
.msg-avatar {
  width: 36px; height: 36px; border-radius: 7px; flex-shrink: 0;
  background: linear-gradient(135deg, #5b8def, #3a6fd8); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}

.msg-row.own .msg-body { align-items: flex-end; }

.msg-bubble {
  padding: 9px 13px; border-radius: 12px; background: var(--bg-elev);
  border: 1px solid var(--border); font-size: 13.5px; word-break: break-word; line-height: 1.55;
  position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.04);

.msg-bubble::after {

  border-top: 6px solid transparent; border-bottom: 6px solid transparent;
}
.msg-row:not(.own) .msg-bubble::after { left: -7px; border-right: 8px solid var(--bg-elev); }
.msg-row:not(.own) .msg-bubble { border-top-left-radius: 4px; }
.msg-row.own .msg-bubble { background: var(--bubble-own); color: var(--bubble-own-text); border-color: transparent; }

.msg-inputbar .input { background: var(--bg-elev); border-radius: 20px; }
.msg-inputbar .btn { border-radius: 20px; padding: 8px 22px; }

.empty-chan { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-mute); font-size: 13px; }

.wizard-body { flex: 1; }

<script>
'use strict';
/* ============================================================
   CoAgent Hub v0.5 管理面板 — 现代化控制台
   零依赖：fetch + WebSocket + 原生 DOM + 手绘 SVG 图表
   ============================================================ */

const $ = (id) => document.getElementById(id);
const TOKEN_KEY = 'coagent_token_v2';
let TOKEN = sessionStorage.getItem(TOKEN_KEY) || '';
let ME = null, HEALTH = null, PAGE = 'dashboard', WS = null;
let WS_RECONNECT = 0, POLL_TIMER = null, LAST_SEQ = 0;
let CACHE = { tasks: [], context: [], reviews: [], branches: [], users: [], events: [], messages: [], stats: null };
let EMBED_BADGE = '🧠 检测中…';
/* 消息页状态 */
let MSG_CHANNEL = 'general';
let MSG_UNREAD = 0;
let MSG_LOADED = false;

/** 拉取语义检索状态，更新徽标文案（Ollama 未启用/不可用时如实显示） */
async function loadEmbedBadge() {
  try {
    const s = await api('GET', '/embed/status');
    if (!s.available) {
      EMBED_BADGE = s.config?.enabled === false ? '🧠 语义检索已关闭' : '🧠 语义检索未连接';
    } else {
      const pct = s.coverage.total ? Math.round((s.coverage.embedded / s.coverage.total) * 100) : 0;
      EMBED_BADGE = `🧠 ${esc(s.model)} · 已索引 ${pct}%`;
    }
  } catch { EMBED_BADGE = '🧠 语义检索未连接'; }
  const el = $('cx-embed-badge');
  if (el) el.textContent = EMBED_BADGE;
  const el2 = $('set-embed');
  if (el2) el2.textContent = EMBED_BADGE;
}
let UNREAD_COUNT = 0;
let DESKTOP_NOTIF = localStorage.getItem('coagent_desktop_notif') === '1';

/** 请求桌面通知权限并显示通知 */
async function enableDesktopNotif() {
  if (!('Notification' in window)) { toast('浏览器不支持桌面通知', 'err'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') { DESKTOP_NOTIF = true; localStorage.setItem('coagent_desktop_notif', '1'); toast('桌面通知已开启', 'ok'); }
  else toast('通知权限被拒绝', 'err');
}
function showDesktopNotif(title, body) {
  if (!DESKTOP_NOTIF || !('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">👑</text></svg>' }); } catch { /* 忽略 */ }
}

/* ---------- 工具 ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dt = (s) => { if (!s) return '—'; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); };
const timeAgo = (s) => { if (!s) return ''; const diff = (Date.now() - new Date(s).getTime()) / 1000; if (diff < 60) return '刚刚'; if (diff < 3600) return Math.floor(diff/60)+' 分钟前'; if (diff < 86400) return Math.floor(diff/3600)+' 小时前'; return Math.floor(diff/86400)+' 天前'; };
const shortId = (id) => String(id || '').slice(0, 8);
const toast = (msg, type = '') => { const t = $('toast'); t.textContent = msg; t.className = 'show ' + type; clearTimeout(t._t); t._t = setTimeout(() => { t.className = ''; }, 3000); };
async function api(method, url, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const text = await res.text();
  let data; try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
  if (!res.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + res.status));
  return data;
}

/* ---------- 极简 Markdown 渲染 ---------- */
function renderMarkdown(text) {
  if (!text) return '';
  let html = esc(text);
  // 代码块
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code}</code></pre>`);
  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 标题
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // 粗体和斜体
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // 链接：只放行安全协议（http/https/mailto/站内相对路径），
  // 拦截 javascript: 等伪协议——正文先经过 esc()，这里无法逃出属性，但协议本身会原样进 href
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, txt, href) => {
    const h = href.trim();
    if (/^(https?:\/\/|mailto:|\/|\.\/|#)/i.test(h)) {
      return `<a href="${h}" target="_blank" rel="noopener noreferrer">${txt}</a>`;
    }
    return m; // 非白名单协议：保持原样（已转义），渲染为普通文本
  });
  // 引用
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // 分割线
  html = html.replace(/^---$/gm, '<hr>');
  // 无序列表
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => '<ul>' + m + '</ul>');
  // 有序列表
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // 段落（剩余非空行）
  html = html.replace(/^(?!<(h[1-3]|ul|ol|li|pre|blockquote|hr|p))/gm, '<p>');
  html = html.replace(/<\/p>\n<p>/g, '</p><p>');
  return '<div class="md">' + html + '</div>';
}

/* ---------- SVG 图表 ---------- */
function barChart(data, opts = {}) {
  const w = opts.width || 320, h = opts.height || 140, pad = 30;
  const max = Math.max(...data.map((d) => d.value), 1);
  const bw = (w - pad * 2) / data.length * 0.6;
  const gap = (w - pad * 2) / data.length * 0.4;
  let bars = '';
  data.forEach((d, i) => {
    const bh = (d.value / max) * (h - pad * 2);
    const x = pad + i * (bw + gap) + gap / 2;
    const y = h - pad - bh;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${d.color || 'var(--accent)'}" opacity="0.8">
      <animate attributeName="height" from="0" to="${bh}" dur="0.4s" fill="freeze"/>
      <animate attributeName="y" from="${h-pad}" to="${y}" dur="0.4s" fill="freeze"/>
    </rect>`;
    bars += `<text x="${x + bw/2}" y="${h - pad + 14}" text-anchor="middle" fill="var(--text-mute)" font-size="10">${d.label}</text>`;
    if (d.value > 0) bars += `<text x="${x + bw/2}" y="${y - 4}" text-anchor="middle" fill="var(--text-sub)" font-size="10" font-weight="600">${d.value}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/>
    ${bars}
  </svg>`;
}

function donutChart(data, opts = {}) {
  const size = opts.size || 140, r = size / 2 - 12, cx = size / 2, cy = size / 2;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  let angle = -Math.PI / 2, segments = '';
  data.forEach((d) => {
    if (d.value === 0) return;
    const a2 = angle + (d.value / total) * Math.PI * 2;
    const large = (a2 - angle) > Math.PI ? 1 : 0;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    segments += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${d.color}" opacity="0.85"/>`;
    angle = a2;
  });  const legend = data.map((d) =>
    `<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0">
      <span style="width:10px;height:10px;border-radius:2px;background:${d.color};display:inline-block"></span>
      <span style="color:var(--text-sub)">${d.label}</span>
      <span style="margin-left:auto;font-family:var(--mono);font-weight:600">${d.value}</span>
    </div>`
  ).join('');
  return `<div style="display:flex;align-items:center;gap:20px">
    <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
      ${segments}
      <circle cx="${cx}" cy="${cy}" r="${r*0.55}" fill="var(--bg-card)"/>
      <text x="${cx}" y="${cy-4}" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700">${total}</text>
      <text x="${cx}" y="${cy+14}" text-anchor="middle" fill="var(--text-mute)" font-size="10">总计</text>
    </svg>
    <div style="flex:1">${legend}</div>
  </div>`;
}

/** 折线图（面积渐变 + 末值标注）—— 用于任务燃尽等累计趋势 */
function lineChart(data, opts = {}) {
  const w = opts.width || 320, h = opts.height || 140, pad = 30;
  const vals = (data || []).map((d) => d.accum ?? d.value ?? 0);
  if (!vals.length) return '<div class="empty"><div class="text">暂无数据</div></div>';
  const max = Math.max(...vals, 1);
  const step = (w - pad * 2) / (vals.length - 1 || 1);
  const px = (i) => pad + i * step;
  const py = (v) => h - pad - (v / max) * (h - pad * 2);
  const pts = vals.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  const area = `${px(0).toFixed(1)},${h - pad} ${pts} ${px(vals.length - 1).toFixed(1)},${h - pad}`;
  const dots = vals.map((v, i) =>
    `<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="3" fill="var(--ok)">
      <title>${data[i]?.label || ''}：${v}</title>
    </circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/>
    <polygon points="${area}" fill="var(--ok)" opacity="0.12"/>
    <polyline points="${pts}" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="0.6s" fill="freeze"/>
    </polyline>
    ${dots}
    ${(data || []).map((d, i) => i % 2 === 0 || i === vals.length - 1
      ? `<text x="${px(i)}" y="${h - pad + 14}" text-anchor="middle" fill="var(--text-mute)" font-size="9">${d.label || ''}</text>` : '').join('')}
    ${vals.length ? `<text x="${px(vals.length - 1) - 6}" y="${py(vals[vals.length - 1]) - 6}" text-anchor="end" fill="var(--ok)" font-size="11" font-weight="700">${vals[vals.length - 1]}</text>` : ''}
  </svg>`;
}

/** 热力图（近 7 天 × 成员）—— 色阶深浅 = 活跃强度 */
function heatmapChart(rows, dayLabels = []) {
  if (!rows || !rows.length) return '<div class="empty"><div class="text">近 7 天还没有活跃记录</div></div>';
  const max = Math.max(...rows.flatMap((r) => r.days), 1);
  const cell = 18, gap = 4, headW = 96;
  const w = headW + dayLabels.length * (cell + gap) + 6;
  const h = rows.length * (cell + gap) + 22;
  const cells = rows.map((r, ri) => r.days.map((v, di) => {
    const a = v ? 0.25 + 0.75 * (v / max) : 0.06;
    return `<rect x="${headW + di * (cell + gap)}" y="${22 + ri * (cell + gap)}" width="${cell}" height="${cell}" rx="3"
      fill="var(--ok)" opacity="${a.toFixed(2)}">
      <title>${esc(r.name)} · ${dayLabels[di] || ''}：${v} 次</title>
    </rect>`;
  }).join('')).join('');
  const names = rows.map((r, ri) =>
    `<text x="${headW - 6}" y="${22 + ri * (cell + gap) + cell / 2 + 3}" text-anchor="end" fill="var(--text-sub)" font-size="10"
      style="max-width:${headW - 10}px">${esc(r.name)}</text>`).join('');
  const dlabels = dayLabels.map((d, di) =>
    `<text x="${headW + di * (cell + gap) + cell / 2}" y="12" text-anchor="middle" fill="var(--text-mute)" font-size="9">${d}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%">
    ${dlabels}${names}${cells}
  </svg>
  <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-mute);margin-top:6px">
    <span>少</span>
    ${[0.08, 0.35, 0.6, 0.85, 1].map((a) => `<span style="width:12px;height:12px;border-radius:2px;background:var(--ok);opacity:${a};display:inline-block"></span>`).join('')}
    <span>多</span>
  </div>`;
}

/* ---------- 主题 ---------- */
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('coagent_theme', next);
}
(function initTheme() { const s = localStorage.getItem('coagent_theme'); if (s) document.documentElement.setAttribute('data-theme', s); })();

/* ---------- 皮肤（经典微信绿 / 科幻 / 可爱） ---------- */
const SKINS = [
  { id: 'classic', name: '经典微信绿', desc: '克制 · 原生协作质感', swatch: ['#07c160', '#0b1014'] },
  { id: 'scifi', name: '科幻赛博', desc: '霓虹 · 深空星舰', swatch: ['#22d3ee', '#e879f9', '#05070d'] },
  { id: 'cute', name: '可爱粉彩', desc: '温柔 · 圆润粉蜡', swatch: ['#f472b6', '#a78bfa', '#fff4f6'] },
];
function applySkin(id) {
  if (id) document.documentElement.setAttribute('data-skin', id);
  localStorage.setItem('coagent_skin', id || 'classic');
  const cur = document.querySelectorAll('.skin-card');
  cur.forEach((c) => c.classList.toggle('active', c.dataset.skin === (id || 'classic')));
}
(function initSkin() {
  const s = localStorage.getItem('coagent_skin');
  if (s && s !== 'classic') document.documentElement.setAttribute('data-skin', s);
})();

/* ---------- 登录 ---------- */
function login() {
  TOKEN = $('token-in').value.trim();
  if (!TOKEN) return;
  api('GET', '/me').then((me) => { ME = me; sessionStorage.setItem(TOKEN_KEY, TOKEN); boot(); })
    .catch((e) => { $('login-err').textContent = '登录失败：' + e.message; });
}
$('token-in').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

// 「双击直达」：coagent.exe app 用 #token= 传递凭证，进面板立即消费并从地址栏清除
// （fragment 不会进服务器访问日志，也不会留在浏览器历史）
(function consumeHashToken() {
  const m = location.hash.match(/^#token=([A-Za-z0-9_.\-]+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  $('token-in').value = decodeURIComponent(m[1]);
  login();
})();

// 首次启动自动填充种子管理员 token（降低上手门槛）
(async function autoFillBootstrap() {
  try {
    const r = await fetch('/auth/bootstrap');
    const b = await r.json();
    if (b.firstRun && b.adminToken && !$('token-in').value) {
      $('token-in').value = b.adminToken;
      $('login-err').innerHTML = '<span style="color:var(--ok)">✓ 检测到首次启动，已自动填充管理员 token，按 Enter 即可登录</span>';
    }
  } catch { /* 非首次或接口不可用，静默 */ }
})();
function logout() { sessionStorage.removeItem(TOKEN_KEY); location.reload(); }

/* ---------- 退出服务（主机） ---------- */
async function shutdownHub() {
  if (!confirm('确定退出 Hub 服务？全组将断开连接（数据已实时落盘，下次双击 CoAgent Hub 图标可再次启动）。')) return;
  try { await api('POST', '/shutdown'); } catch (e) { toast('✗ ' + e.message + '（需要主机本机 + 管理员权限）', 'err'); return; }
  sessionStorage.removeItem(TOKEN_KEY);
  try { WS?.close(); } catch {}
  if (POLL_TIMER) clearInterval(POLL_TIMER);
  document.documentElement.innerHTML = '<body style="background:#0d1117;color:#e6edf3;display:flex;align-items:center;justify-content:center;height:100vh;font-family:Segoe UI,Microsoft YaHei,sans-serif"><div style="text-align:center"><div style="font-size:42px">👋</div><p style="margin-top:12px">服务已退出，可以关闭本窗口。</p><p style="color:#8b949e;font-size:13px;margin-top:6px">下次双击 CoAgent Hub 图标即可再次启动。</p></div></body>';
}

/* ---------- 启动 ---------- */
async function boot() {
  $('login').style.display = 'none';
  $('app').style.display = 'flex';
  $('user-name').textContent = ME.name;
  $('user-id').textContent = ME.userId;
  $('user-avatar').textContent = (ME.name || ME.userId || '?').charAt(0).toUpperCase();
  UNREAD_COUNT = NOTIFS.filter((n) => !n.read).length;
  updateNotifDot();
  try { HEALTH = await api('GET', '/healthz'); $('brand-ver').textContent = 'v' + HEALTH.version; LAST_SEQ = HEALTH.lastSeq; } catch {}
  try { PERSONA_LIB = (await api('GET', '/personas')).personas || []; } catch { /* 兼容 */ }
  connectWS();
  await refreshAll();
  nav('dashboard');
  if (POLL_TIMER) clearInterval(POLL_TIMER);
  POLL_TIMER = setInterval(() => { if (document.visibilityState === 'visible') refreshAll(); }, 30000);
}

/* ---------- WebSocket ---------- */
function connectWS() {
  if (WS) { try { WS.close(); } catch {} }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try { WS = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(TOKEN)}&since=${LAST_SEQ}`); }
  catch { setWsStatus('不可用', false); return; }
  WS.onopen = () => { WS_RECONNECT = 0; setWsStatus('实时连接', true); };
  WS.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'hello') { LAST_SEQ = msg.lastSeq || LAST_SEQ; updateSeq(); return; }
    if (msg.seq) {
      LAST_SEQ = Math.max(LAST_SEQ, msg.seq);
      updateSeq();
      notifyPush(msg);
      // 消息页：实时追加聊天气泡；不在消息页则累计未读
      if (msg.type === 'message.posted') {
        if (!CACHE.messages.some((m) => m.seq === msg.seq)) CACHE.messages.push(msg);
        if (PAGE === 'messages') appendMsgBubble(msg);
        else { MSG_UNREAD++; updateMsgBadge(); }
      }
      // 桌面通知：仅对重要事件
      if (DESKTOP_NOTIF && document.visibilityState !== 'visible') {
        const notifMap = {
          'task.created': '新任务', 'task.claimed': '任务被认领',
          'context.appended': '新上下文', 'review.requested': '新 PR 审核',
          'review.approved': 'PR 已批准', 'comment.posted': '新评论',
          'branch.pushed': '代码推送', 'message.posted': '新消息',
        };
        if (notifMap[msg.type]) showDesktopNotif(notifMap[msg.type], msg.payload?.title || msg.payload?.text || msg.payload?.branch || '');
      }
    }
    if (PAGE === 'activity' || PAGE === 'dashboard') renderCurrent();
    updateBadges();
  };
  WS.onclose = () => { setWsStatus('重连中…', false); WS_RECONNECT++; setTimeout(connectWS, Math.min(1000 * 2**WS_RECONNECT, 15000)); };
  WS.onerror = () => { try { WS.close(); } catch {} };
}
const setWsStatus = (t, live) => { $('ws-status').textContent = t; $('ws-dot').className = 'dot' + (live ? ' live' : ''); };
const updateSeq = () => { $('seq-display').textContent = 'seq ' + LAST_SEQ; };
const updateNotifDot = () => {
  const b = $('notif-dot');
  if (UNREAD_COUNT > 0) { b.style.display = ''; b.textContent = UNREAD_COUNT > 9 ? '9+' : UNREAD_COUNT; }
  else b.style.display = 'none';
};

/* ---------- 数据刷新 ---------- */
let PERSONA_MAP = {};   // authorId -> {id, prompt}（全员人格，来自 /stats）
let PERSONA_LIB = [];   // 内置人格库缓存（用户管理页用）
async function refreshAll() {
  try {
    const [h, tasks, ctx, rev, br, stats] = await Promise.all([
      api('GET', '/healthz'), api('GET', '/tasks'), api('GET', '/context?limit=50'),
      api('GET', '/reviews'), api('GET', '/branches'), api('GET', '/stats'),
    ]);
    HEALTH = h; LAST_SEQ = h.lastSeq; updateSeq();
    CACHE.tasks = tasks.tasks; CACHE.context = ctx.entries; CACHE.reviews = rev.reviews;
    CACHE.branches = br.branches; CACHE.stats = stats;
    PERSONA_MAP = stats.personas || {};
    if (stats.onlineUsers) $('online-count').textContent = stats.onlineUsers.length;
    loadEmbedBadge();
    loadUpdateStatus();
    loadLicense();
    updateBadges();
    // 消息页由 WS 实时驱动 + 输入框需要保留焦点，不做定时全量重绘
    if (PAGE !== 'messages') renderCurrent();
  } catch (e) { if (String(e.message).includes('401')) logout(); }
}
/* 作者人格徽章（独立视角可视化）：有 persona 返回 emoji 气泡，否则空 */
function personaBadge(authorId) {
  const p = PERSONA_MAP[authorId];
  if (!p) return '';
  const lib = PERSONA_LIB.find((x) => x.id === p.id);
  return `<span class="persona-chip" title="${esc(p.prompt || '')}">${lib ? lib.emoji : '🧠'}</span>`;
}
function updateBadges() {
  const ot = CACHE.tasks.filter((t) => t.status === 'open').length;
  const or = CACHE.reviews.filter((r) => r.status === 'open').length;
  const bt = $('badge-tasks'), br = $('badge-reviews');
  if (ot > 0) { bt.style.display = ''; bt.textContent = ot; } else bt.style.display = 'none';
  if (or > 0) { br.style.display = ''; br.textContent = or; } else br.style.display = 'none';
}

  const max = Math.max(...arr.map((c) => c.count), 1);
  const medal = ['🥇', '🥈', '🥉'];
  return `<div style="display:flex;flex-direction:column;gap:10px">
    ${arr.map((c, i) => `
      <div style="display:flex;align-items:center;gap:10px">
        <span style="width:22px;text-align:center;font-size:15px">${medal[i] || '<span style="font-size:11px;color:var(--text-sub)">' + (i + 1) + '</span>'}</span>

}
function formatUptime(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
async function renderDashActivity() {

function dropTask(e, status) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!DRAG_TASK_ID) return;
  const id = DRAG_TASK_ID;
  DRAG_TASK_ID = null;
  // 认领 / 释放走专用接口（服务端 PATCH 已禁止携带 assignee），done 等纯状态走 PATCH
  const req = status === 'claimed' ? api('POST', `/tasks/${id}/claim`)
    : status === 'open' ? api('POST', `/tasks/${id}/release`, {})
    : api('PATCH', `/tasks/${id}`, { status });
  req.then(() => { toast('任务已移动', 'ok'); refreshAll(); })
    .catch((err) => { toast('✗ ' + err.message, 'err'); });
}
function createTask() {
  const title = $('tk-title').value.trim();
  if (!title) return toast('标题不能为空', 'err');
  const body = { title, description: $('tk-desc').value.trim(), priority: $('tk-priority').value };
  const due = $('tk-due').value;
  if (due) body.dueDate = new Date(due).toISOString();
  api('POST', '/tasks', body).then(() => { toast('任务已创建', 'ok'); $('tk-title').value = ''; $('tk-desc').value = ''; $('tk-due').value = ''; refreshAll(); })
    .catch((e) => toast('✗ ' + e.message, 'err'));
}
function claimTask(id) { api('POST', `/tasks/${id}/claim`).then(() => { toast('已认领', 'ok'); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err')); }
function doneTask(id) { api('PATCH', `/tasks/${id}`, { status: 'done' }).then(() => { toast('已标记完成', 'ok'); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err')); }
function toggleBatchMode() { BATCH_MODE = !BATCH_MODE; BATCH_SELECTED.clear(); renderTasks(); }
function toggleTaskSelect(id, checked) { if (checked) BATCH_SELECTED.add(id); else BATCH_SELECTED.delete(id); renderTasks(); }
async function batchAction(action, value) {
  if (!BATCH_SELECTED.size) return toast('未选择任务', 'err');
  if (action === 'delete' && !confirm(`确定删除选中的 ${BATCH_SELECTED.size} 个任务？`)) return;
  let ok = 0, fail = 0;
  for (const id of BATCH_SELECTED) {
    try {
      if (action === 'done') await api('PATCH', `/tasks/${id}`, { status: 'done' });
      else if (action === 'priority') await api('PATCH', `/tasks/${id}`, { priority: value });
      else if (action === 'delete') await api('DELETE', `/tasks/${id}`);
      ok++;
    } catch { fail++; }
  }
  toast(`批量操作完成：成功 ${ok}，失败 ${fail}`, fail ? 'err' : 'ok');
  BATCH_SELECTED.clear();
  BATCH_MODE = false;
  refreshAll();
}

/* ============================================================
   消息（聊天）—— 群聊消息的可视化，WS 实时驱动
   ============================================================ */
function msgChannels() {
  const set = new Set(['general']);
  for (const m of CACHE.messages) {
    const ch = m.payload?.channel;
    if (ch) set.add(ch);
  }
  return [...set];
}
function updateMsgBadge() {
  const b = $('badge-msgs');
  if (MSG_UNREAD > 0) { b.style.display = ''; b.textContent = MSG_UNREAD; }
  else b.style.display = 'none';
}
function msgBubbleHTML(ev) {
  const own = ev.authorId === ME.userId;
  const text = esc(ev.payload?.text || '').replace(/\n/g, '<br>');
  const ch = ev.payload?.channel || 'general';
  const chTag = ch !== 'general' && ch !== MSG_CHANNEL ? `<span class="chip" style="font-size:10px;margin-left:4px">${esc(ch)}</span>` : '';
  return `
    <div class="msg-row ${own ? 'own' : ''}">
      <div class="msg-avatar">${esc((ev.authorId || '?').charAt(0).toUpperCase())}</div>
      <div class="msg-body">
        <div class="msg-meta">${own ? '我' : esc(ev.authorId)}${personaBadge(ev.authorId)} · ${timeAgo(ev.ts)}${chTag}</div>
        <div class="msg-bubble">${text || '<span style="color:var(--text-mute)">（空消息）</span>'}</div>
      </div>
    </div>`;
}
/* 微信式消息流：按天插入「今天 / 昨天 / 日期」分隔线 */
function msgListHTML(list) {
  let out = '', lastDay = '';
  const now = new Date();
  const yesterday = new Date(now.getTime() - 864e5).toDateString();
  for (const ev of list) {
    const d = new Date(ev.ts);
    const dayKey = d.toDateString();
    if (dayKey !== lastDay) {
      lastDay = dayKey;
      const label = dayKey === now.toDateString() ? '今天'
        : dayKey === yesterday ? '昨天'
        : d.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
      out += `<div class="msg-day">${label}</div>`;
    }
    out += msgBubbleHTML(ev);
  }
  return out;
}
function appendMsgBubble(ev) {
  const stream = $('msg-stream');
  if (!stream || (ev.payload?.channel || 'general') !== MSG_CHANNEL) return;
  stream.insertAdjacentHTML('beforeend', msgBubbleHTML(ev));
  stream.scrollTop = stream.scrollHeight;
}
async function loadMessages() {
  try {
    const r = await api('GET', '/events?type=message.posted&after=0&limit=2000');
    CACHE.messages = r.events || [];
    MSG_LOADED = true;
  } catch { /* 降级：只用 WS 实时收到的 */ }
}
async function renderMessages() {
  if (!MSG_LOADED) await loadMessages();
  MSG_UNREAD = 0;
  updateMsgBadge();
  // 微信式双栏：左侧会话列表（频道 + 最近一条预览），右侧当前频道的对话
  const rows = msgChannels().map((ch) => {
    const msgs = CACHE.messages.filter((m) => (m.payload?.channel || 'general') === ch);
    const last = msgs[msgs.length - 1];
    return { ch, count: msgs.length, preview: last?.payload?.text || '还没有消息', time: last ? timeAgo(last.ts) : '' };
  });
  const list = CACHE.messages.filter((m) => (m.payload?.channel || 'general') === MSG_CHANNEL);
  const chLabel = MSG_CHANNEL === 'general' ? '🏠 全组大厅' : '📌 ' + esc(MSG_CHANNEL);
  $('content').innerHTML = `
    <div class="msg-layout">
      <div class="msg-side">
        <div class="side-title">消息 (${CACHE.messages.length})</div>
        ${rows.map((r) => `
          <div class="msg-chan ${r.ch === MSG_CHANNEL ? 'active' : ''}" onclick="switchChannel('${esc(r.ch)}')">
            <div class="ava">${r.ch === 'general' ? '🏠' : '📌'}</div>
            <div class="meta">
              <div class="n">${esc(r.ch)}</div>
              <div class="preview">${esc(r.preview)}</div>
            </div>
            <span class="time">${esc(r.time)}</span>
          </div>`).join('')}
      </div>
      <div class="msg-main">
        <div class="msg-chat-head">${chLabel}<span class="sub">· ${list.length} 条消息 · Enter 发送</span></div>
        <div class="msg-stream" id="msg-stream">
          ${list.length ? msgListHTML(list) : '<div class="empty-chan">还没有消息，打个招呼吧 👋</div>'}
        </div>
        <div class="msg-inputbar">
          <input class="input" id="msg-input" placeholder="发消息到 #${esc(MSG_CHANNEL)} …"
                 onkeydown="if(event.key==='Enter'){sendMsg()}">
          <button class="btn" onclick="sendMsg()">发送</button>
        </div>
      </div>
    </div>`;
  const stream = $('msg-stream');
  if (stream) stream.scrollTop = stream.scrollHeight;
  $('msg-input').focus();
}
function switchChannel(ch) { MSG_CHANNEL = ch; renderMessages(); }
async function sendMsg() {
  const input = $('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    await api('POST', '/messages', { text, channel: MSG_CHANNEL });
    // WS 会推回自己发的消息并追加气泡；网络不佳时这里兜底重拉
    setTimeout(() => { if (PAGE === 'messages') loadMessages().then(() => { if (PAGE === 'messages') renderMessages(); }); }, 800);
  } catch (e) {
    input.value = text;
    toast('✗ ' + e.message, 'err');
  }
}

async function wzCheckSeed() {

async function wzRotateSeeds() {
  const out = $('wz-seed-out');

  const lines = [];

async function postCtx() {
  const title = $('cx-title').value.trim();
  if (!title) return toast('标题不能为空', 'err');
  // 先上传待处理的文件
  const attachments = [];
  for (const f of CTX_PENDING_FILES) {
    try {
      const meta = await uploadFile(f);
      attachments.push(meta.id);
    } catch (e) { toast('✗ 文件上传失败: ' + f.name, 'err'); return; }
  }
  const tags = $('cx-tags').value.split(',').map((t) => t.trim()).filter(Boolean);
  api('POST', '/context', {
    type: $('cx-type').value || 'note', title,
    body: $('cx-body').value.trim(),
    tags, attachments,
  }).then(() => {
    toast('已上墙，全组可见', 'ok');
    $('cx-title').value = ''; $('cx-body').value = ''; $('cx-tags').value = '';
    CTX_PENDING_FILES = []; updatePendingFiles();
    refreshAll();
  }).catch((e) => toast('✗ ' + e.message, 'err'));
}
function handleCtxFiles(fileList) {
  for (const f of fileList) CTX_PENDING_FILES.push(f);
  updatePendingFiles();
}
function updatePendingFiles() {
  const el = $('cx-pending');
  if (!el) return;
  if (CTX_PENDING_FILES.length) {
    el.innerHTML = CTX_PENDING_FILES.map((f, i) =>
      `<span class="chip info" style="margin-right:4px">📎 ${esc(f.name)} (${(f.size/1024).toFixed(0)}KB)
        <span onclick="CTX_PENDING_FILES.splice(${i},1);updatePendingFiles()" style="cursor:pointer;margin-left:4px">✕</span></span>`
    ).join('');
  } else el.textContent = '';
}
async function uploadFile(file) {
  const buf = await file.arrayBuffer();
  const res = await fetch('/files', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': file.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(file.name) },
    body: buf,
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return (await res.json()).file;
}
function retractCtx(id) { if (!confirm('确定撤回？软删除，留痕。')) return; api('POST', `/context/${id}/retract`).then(() => { toast('已撤回', 'ok'); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err')); }
function pinCtx(id, pinned) { api('POST', `/context/${id}/pin`, { pinned }).then(() => { toast(pinned ? '已置顶' : '已取消置顶', 'ok'); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err')); }
function reviseCtx(id, oldTitle, oldBody) {
  const newBody = prompt('修订正文（Markdown）：', oldBody);
  if (newBody === null) return;
  api('POST', `/context/${id}/revise`, { body: newBody }).then(() => { toast('已修订', 'ok'); refreshAll(); }).catch((e) => toast('✗ ' + e.message, 'err'));
}

function eventTimelineItem(ev) {
  const tc = { 'context.appended':'accent','context.retracted':'err','task.created':'info','task.claimed':'warn','task.updated':'info','task.released':'warn','branch.created':'purple','branch.pushed':'ok','branch.merged':'ok','review.requested':'warn','review.approved':'ok','review.rejected':'err','comment.posted':'info','comment.deleted':'err','message.posted':'info','agent.status':'' };
  let desc = ''; const p = ev.payload || {};
  switch (ev.type) {
    case 'context.appended': desc = `发布了「${p.title || ''}」`; break;
    case 'context.retracted': desc = `撤回了上下文 ${shortId(p.targetId || p.id)}`; break;
    case 'task.created': desc = `创建任务「${p.title || ''}」`; break;
    case 'task.claimed': desc = `认领了任务「${p.title || ''}」`; break;
    case 'task.updated': desc = `更新了任务 ${shortId(p.id)}（${(p.fields||[]).join(', ')}）`; break;
    case 'task.released': desc = `释放了任务 ${shortId(p.id)}${p.forced ? '（强制）' : ''}`; break;
    case 'branch.created': desc = `创建分支 ${p.branch}`; break;
    case 'branch.pushed': desc = `推送分支 ${p.branch} → ${(p.sha||'').slice(0,7)}`; break;
    case 'branch.merged': desc = `合并 ${p.branch} → ${p.base}`; break;
    case 'review.requested': desc = `发起 PR：${p.branch} → ${p.base}`; break;
    case 'review.approved': desc = `批准了 PR ${shortId(p.id)}`; break;
    case 'review.rejected': desc = `拒绝了 PR ${shortId(p.id)}`; break;
    case 'comment.posted': desc = `发表评论：${p.preview || ''}`; break;
    case 'comment.deleted': desc = `删除了评论 ${shortId(p.id)}`; break;
    case 'message.posted': desc = `说：${p.text || ''}`; break;
    case 'agent.status': desc = `上报状态：${JSON.stringify(p)}`; break;
    default: desc = JSON.stringify(p);
  }
  return `<div class="tl-item ${tc[ev.type] || ''}"><div class="tl-head"><span class="tl-type">#${ev.seq} ${esc(ev.type)}</span><span class="tl-time">${dt(ev.ts)} · ${timeAgo(ev.ts)}</span></div>
    <div class="tl-body"><span class="author">${esc(ev.authorId)}${personaBadge(ev.authorId)}</span> ${esc(desc)}</div></div>`;
}

function formatBytes(n) {
  if (!n) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n >= 10 || i === 0 ? 0 : 1) + ' ' + u[i];
}

    el.innerHTML = `当前版本 v${esc(s.current)} · 源码模式运行<br><span style="font-size:12px;color:var(--text-sub)">更新方式：git pull 后重新启动。</span>`;
    return;
  }
  if (s.available) {
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="chip ok">🆕 发现新版本 v${esc(s.latest)}</span>
        <span style="font-size:12px;color:var(--text-sub)">当前 v${esc(s.current)}</span>
        ${s.notes ? `<a href="${esc(s.notes)}" target="_blank" style="font-size:12px;color:var(--accent)">更新内容</a>` : ''}
        <button class="btn" onclick="doUpdate()">一键更新</button>
      </div>`;
    return;
  }
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="chip ok">✓ 已是最新版本</span>
      <span style="font-size:12px;color:var(--text-sub)">v${esc(s.current)}${s.offline ? ' · 离线状态，未能联网检查' : ''}</span>
      <button class="btn ghost sm" onclick="loadUpdateStatus()">检查更新</button>
    </div>`;
}
async function doUpdate() {
  if (!confirm('将下载新版本并自动重启服务（约十几秒，期间所有人短暂掉线，数据不受影响）。继续更新？')) return;
  const el = $('upd-body');
  if (el) el.innerHTML = '⏬ 正在下载并替换新版本…服务将自动重启，请保持本页打开';
  try {
    const r = await api('POST', '/update/apply');
    const oldVer = HEALTH?.version;
    if (el) el.innerHTML = `✓ 已更新到 v${esc(r.version)}，服务重启中，页面将自动刷新…${r.macNote ? '<br><b style="color:var(--warn)">macOS：</b>重启后首次打开需重跑一次签名命令（同首次安装）。' : ''}`;
    const start = Date.now();
    const timer = setInterval(async () => {
      try {
        const h = await fetch('/healthz').then((x) => x.json());
        if (h.version && h.version !== oldVer) {
          clearInterval(timer);
          setTimeout(() => location.reload(), 800);
        }
        if (Date.now() - start > 45000) { clearInterval(timer); if (el) el.innerHTML += '<br><span style="color:var(--err)">等待超时，请手动刷新页面；若服务未启动，双击 CoAgent Hub 图标重新打开。</span>'; }
      } catch { /* 重启间隙，继续等 */ }
    }, 1500);
  } catch (e) {
    if (el) el.innerHTML = '✗ 更新失败：' + esc(e.message) + ' <button class="btn ghost sm" onclick="renderUpdateCard()">返回</button>';
  }
}
async function exportData() {
  try {
    const res = await fetch('/admin/export', { headers: { Authorization: 'Bearer ' + TOKEN } });
    if (!res.ok) throw new Error('导出失败（需管理员权限）');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `coagent-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
    toast('数据已导出', 'ok');
  } catch (e) { toast('✗ ' + e.message, 'err'); }
}

let CMD_ITEMS = [], CMD_INDEX = 0;
function openCmd() {
  $('cmd-root').innerHTML = `<div class="cmd-palette">
    <input class="cmd-input" id="cmd-input" placeholder="搜索任务、上下文，或执行命令…" oninput="filterCmd(this.value)" onkeydown="cmdKey(event)">
    <div class="cmd-results" id="cmd-results"></div>
    <div class="cmd-footer"><span>↑↓ 导航</span><span>Enter 执行</span><span>Esc 关闭</span></div>
  </div>`;
  $('cmd-input').focus();
  filterCmd('');
}
function closeCmd() { $('cmd-root').innerHTML = ''; }
async function filterCmd(q) {
  q = q.trim();
  const items = [];
  // 快捷命令
  const actions = [
    { icon: '➕', text: '创建新任务', sub: '打开任务创建表单', action: () => { closeCmd(); nav('tasks'); } },
    { icon: '💬', text: '发布共享笔记', sub: '上下文上墙', action: () => { closeCmd(); nav('context'); } },
    { icon: '🔍', text: '发起 PR 审核', sub: '请求合入 main', action: () => { closeCmd(); nav('reviews'); } },
    { icon: '👤', text: '开户邀请同学', sub: '用户管理', action: () => { closeCmd(); nav('users'); } },
    { icon: '📊', text: '前往仪表盘', sub: '概览统计', action: () => { closeCmd(); nav('dashboard'); } },
    { icon: '⚡', text: '查看活动流', sub: '事件时间线', action: () => { closeCmd(); nav('activity'); } },
    { icon: '🌓', text: '切换主题', sub: '深色/浅色', action: () => { closeCmd(); toggleTheme(); } },
  ];
  for (const a of actions) { if (!q || a.text.includes(q) || a.sub.includes(q)) items.push(a); }
  // 搜索任务
  if (q) {
    try {
      const r = await api('GET', `/search?q=${encodeURIComponent(q)}&limit=5`);
      for (const t of r.tasks || []) items.push({ icon: '✅', text: t.title, sub: `任务 · ${t.status} · ${t.priority}`, action: () => { closeCmd(); openTaskDetail(t.id); } });
      for (const c of r.context || []) items.push({ icon: '💬', text: c.title, sub: `上下文 · ${c.type} · ${c.authorId}`, action: () => { closeCmd(); nav('context'); } });
    } catch {}
  }
  CMD_ITEMS = items; CMD_INDEX = 0;
  $('cmd-results').innerHTML = items.length ? items.map((it, i) =>
    `<div class="cmd-item ${i === 0 ? 'selected' : ''}" onclick="CMD_ITEMS[${i}].action()">
      <span class="cmd-icon">${it.icon}</span><span class="cmd-text">${esc(it.text)}<div class="sub">${esc(it.sub)}</div></span></div>`
  ).join('') : '<div class="empty" style="padding:20px"><div class="text">无匹配结果</div></div>';
}
function cmdKey(e) {
  const items = $('cmd-results').querySelectorAll('.cmd-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); CMD_INDEX = Math.min(CMD_INDEX + 1, CMD_ITEMS.length - 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); CMD_INDEX = Math.max(CMD_INDEX - 1, 0); }
  else if (e.key === 'Enter') { e.preventDefault(); CMD_ITEMS[CMD_INDEX]?.action(); return; }
  else if (e.key === 'Escape') { closeCmd(); return; }
  items.forEach((el, i) => el.classList.toggle('selected', i === CMD_INDEX));
  items[CMD_INDEX]?.scrollIntoView({ block: 'nearest' });
}

  };

  return { ...m, text: m.text || ev.type };
}
function notifyPush(ev) {
  NOTIFS = NOTIFS.filter((n) => n.seq !== ev.seq);
  NOTIFS.unshift({ seq: ev.seq, type: ev.type, authorId: ev.authorId, ts: ev.ts, payload: ev.payload, read: false });
  saveNotifs();
  UNREAD_COUNT = NOTIFS.filter((n) => !n.read).length;

function toggleNotif() {

    </div>

  // 打开即视为已读（有未读时）

function notifOpen(type) {

}
function closeNotifOnce(e) { if (!$('.notif-panel')?.contains(e.target)) $('notif-root').innerHTML = ''; }

/* ============================================================
   键盘快捷键
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openCmd(); }
  else if (e.key === 'Escape') { closeCmd(); closeModal(); $('notif-root').innerHTML = ''; }
  else if (e.key === 'n' && !e.ctrlKey && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    e.preventDefault(); nav('tasks'); setTimeout(() => $('tk-title')?.focus(), 100);
  }
  else if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    e.preventDefault(); openCmd();
  }
});

/* ---------- 自动登录 ---------- */
if (TOKEN) { api('GET', '/me').then((me) => { ME = me; boot(); }).catch(() => { sessionStorage.removeItem(TOKEN_KEY); TOKEN = ''; }); }
</script>
</body>
